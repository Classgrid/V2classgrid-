<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Classgrid - Classgrid</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body, html {
      margin: 0; padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #171717;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      padding: 40px 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    .header {
      margin-bottom: 32px;
    }
    .logo-container {
      display: flex;
      align-items: center;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }
    .brand {
      font-size: 18px;
      font-weight: 600;
      margin-left: 10px;
      color: #171717;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 16px;
      color: #171717;
    }
    p {
      font-size: 15px;
      line-height: 24px;
      margin: 0 0 20px;
      color: #525252;
    }
    ul {
      margin: 0 0 20px 20px;
      color: #525252;
      font-size: 15px;
      padding: 0;
    }
    li {
      margin-bottom: 8px;
    }
    .btn {
      display: inline-block;
      background-color: #171717;
      color: #ffffff !important;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .btn-danger {
      background-color: #dc2626;
    }
    .box {
      background-color: #fafafa;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .box p {
      margin-bottom: 0;
      color: #171717;
    }
    .box .meta {
      font-size: 13px;
      color: #737373;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    .box .code {
      font-family: monospace;
      font-size: 20px;
      color: #171717;
      letter-spacing: 2px;
    }
    hr {
      border: none;
      border-top: 1px solid #e5e5e5;
      margin: 40px 0 32px;
    }
    .footer {
      font-size: 13px;
      color: #737373;
      line-height: 20px;
    }
    .footer a {
      color: #737373;
      text-decoration: underline;
    }
    .support-text {
      font-size: 14px;
      color: #525252;
      margin-top: 32px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <div class="logo-container">
          <img src="https://fiherpwzabiftbkwuqsb.supabase.co/storage/v1/object/public/notes-files/android-chrome-512x512.png" alt="Classgrid" class="logo">
          <span class="brand">Classgrid</span>
        </div>
      </div>
      
    <h1>Welcome to Classgrid</h1>
    <p>Hi Test, your account is successfully created.</p>
    <p>You signed in using <strong>Email & Password</strong>.</p>
    <a href="http://localhost:3000/classroom" class="btn">Go to Dashboard</a>
  
      <div class="support-text">
        <p style="margin-bottom:0;">For contact, mail us at: <a href="mailto:support@classgrid.in" style="color:#171717; font-weight:500; text-decoration:none;">support@classgrid.in</a></p>
      </div>
      <hr>
      <div class="footer">
        
        <p style="font-size: 13px; margin-bottom: 0; color: #737373;">&copy; 2026 Classgrid. All rights reserved.</p>
      </div>
    </div>
  </div>
</body>
</html>
