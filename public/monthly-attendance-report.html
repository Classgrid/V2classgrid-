<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <script>
        (function () {
            var _cb = location.origin.includes('localhost') ? 'http://localhost:3000' : '';
            var _tok = localStorage.getItem('jwt_token'); 
            var _hdrs = { 'Cache-Control': 'no-store' }; 
            if (_tok && _tok !== 'null' && _tok !== 'undefined') { _hdrs['Authorization'] = 'Bearer ' + _tok; } 
            fetch(_cb + '/api/auth/me', { credentials: 'include', cache: 'no-store', headers: _hdrs })
                .then(function (r) { if (!r.ok) throw 0; })
                .catch(function () { window.location.replace('/login.html'); });
        })();
    </script>
    <script src="/app-state.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Attendance Report | Classgrid</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #ffffff;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-body: #475569;
            --blue: #3b82f6;
            --green: #10b981;
            --red: #ef4444;
            --gray: #94a3b8;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
        }

        .header h1 {
            font-family: 'Sora', sans-serif;
            font-size: 24px;
            margin: 0;
            color: var(--text);
        }

        .header p {
            margin: 4px 0 0;
            color: var(--text-body);
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .table-container {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: center;
        }

        th {
            background: #f8fafc;
            font-family: 'Sora', sans-serif;
            font-weight: 600;
            color: var(--text-body);
            position: sticky;
            top: 0;
        }

        .col-name {
            text-align: left;
            position: sticky;
            left: 0;
            background: #fff;
            z-index: 10;
            min-width: 150px;
            font-weight: 600;
        }

        th.col-name {
            background: #f8fafc;
            z-index: 11;
        }

        .status-P {
            color: var(--green);
            font-weight: 700;
        }

        .status-A {
            color: var(--red);
            font-weight: 700;
        }

        .status-none {
            color: var(--gray);
        }

        /* Print Styles */
        @media print {
            body { padding: 0; }
            .controls { display: none; }
            .header { border-bottom: 1px solid #000; }
            table { border-collapse: collapse; width: 100%; }
            th, td { border: 1px solid #000; padding: 4px; font-size: 11px; }
            .table-container { border: none; overflow: visible; }
            @page { size: landscape; margin: 1cm; }
        }
    </style>
</head>

<body>
    <div class="header">
        <div>
            <h1 id="reportTitle">Monthly Attendance Report</h1>
            <p id="reportMeta">Loading...</p>
        </div>
        <div class="controls">
            <button class="btn btn-primary" onclick="window.print()">
                <i class="fas fa-print"></i> Print Report
            </button>
            <button class="btn" onclick="window.close()">
                Close
            </button>
        </div>
    </div>

    <div class="table-container">
        <table id="reportTable">
            <thead>
                <tr id="tableHeader">
                    <th class="col-name">Student Name</th>
                    <!-- Days will be injected here -->
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="32">Loading data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_BASE = location.origin.includes('localhost') ? 'http://localhost:3000' : '';
        
        async function loadReport() {
            const params = new URLSearchParams(window.location.search);
            const classroomId = params.get('classroomId');
            const month = params.get('month') || new Date().getMonth() + 1;
            const year = params.get('year') || new Date().getFullYear();

            if (!classroomId) {
                document.getElementById('reportMeta').innerText = "Error: Missing classroom ID.";
                return;
            }

            try {
                const token = localStorage.getItem('jwt_token');
                const res = await fetch(`${API_BASE}/api/attendance/${classroomId}/monthly-grid?month=${month}&year=${year}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error('Failed to fetch data');

                const data = await res.json();
                
                // Update Meta
                const monthName = new Date(year, month - 1, 1).toLocaleString('default', { month: 'long' });
                document.getElementById('reportTitle').innerText = `Attendance Report - ${monthName} ${year}`;
                document.getElementById('reportMeta').innerText = `${data.grid.length} Students | Generated on ${new Date().toLocaleDateString()}`;

                // Build Header
                const thead = document.getElementById('tableHeader');
                let thHtml = `<th class="col-name">Student Name</th>`;
                for (let i = 1; i <= data.daysInMonth; i++) {
                    thHtml += `<th>${i}</th>`;
                }
                thead.innerHTML = thHtml;

                // Build Body
                const tbody = document.getElementById('tableBody');
                let trHtml = '';

                if (data.grid.length === 0) {
                    trHtml = `<tr><td colspan="${data.daysInMonth + 1}">No students found.</td></tr>`;
                } else {
                    data.grid.forEach(student => {
                        let row = `<tr><td class="col-name"><div>${student.name}</div><div style="font-size:10px;color:var(--text-body);font-weight:normal">${student.prn}</div></td>`;
                        for (let i = 1; i <= data.daysInMonth; i++) {
                            const status = student.days[i];
                            let cssClass = 'status-none';
                            if (status === 'P') cssClass = 'status-P';
                            if (status === 'A') cssClass = 'status-A';
                            row += `<td class="${cssClass}">${status}</td>`;
                        }
                        row += `</tr>`;
                        trHtml += row;
                    });
                }
                tbody.innerHTML = trHtml;

            } catch (err) {
                console.error(err);
                document.getElementById('reportMeta').innerText = "Error loading report.";
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="32" style="color:red">Failed to load attendance data.</td></tr>`;
            }
        }

        window.onload = loadReport;
    </script>
</body>
</html>
