<html lang="en">

<head>

    <script src="/app-state.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Marks Manager | Classgrid</title>
    <link rel="icon" href="/Classgrid.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* WebView Fix: prevent horizontal overflow */
        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100%;
        }
        :root {
            --bg-deep: #050a18;
            --bg-primary: #0a1628;
            --bg-secondary: #0d1f3c;
            --bg-card: rgba(13, 31, 60, 0.55);
            --glass-bg: rgba(15, 25, 55, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.12);
            --cyan: #00d4ff;
            --cyan-dim: rgba(0, 212, 255, 0.15);
            --purple: #a855f7;
            --purple-dim: rgba(168, 85, 247, 0.15);
            --green: #10b981;
            --green-dim: rgba(16, 185, 129, 0.15);
            --red: #ef4444;
            --red-dim: rgba(239, 68, 68, 0.15);
            --orange: #f97316;
            --white: #f1f5f9;
            --silver: #94a3b8;
            --muted: #475569;
            --text-dim: #64748b;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --navbar-h: 64px;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
        }

        body {
            font-family: 'DM Sans', 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--white);
            min-height: 100vh;
        }

        /* COSMIC BG */
        .cosmos {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(ellipse at 20% 50%, rgba(10, 30, 80, .4) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(100, 40, 200, .15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(0, 212, 255, .08) 0%, transparent 50%),
                var(--bg-deep);
        }

        .cosmos::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 10% 20%, rgba(255, 255, 255, .4) 0%, transparent 100%),
                radial-gradient(1px 1px at 30% 60%, rgba(255, 255, 255, .3) 0%, transparent 100%),
                radial-gradient(1px 1px at 50% 10%, rgba(255, 255, 255, .5) 0%, transparent 100%),
                radial-gradient(1px 1px at 70% 80%, rgba(255, 255, 255, .3) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 40%, rgba(255, 255, 255, .4) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 15% 85%, rgba(0, 212, 255, .6) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 85% 15%, rgba(168, 85, 247, .5) 0%, transparent 100%);
            animation: twinkle 8s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: .6
            }

            100% {
                opacity: 1
            }
        }

        /* NAVBAR */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--navbar-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: #000000;
            border-bottom: 1px solid var(--glass-border);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topbar-left img {
            height: 28px;
            border-radius: 4px;
        }

        .topbar-brand {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            color: #fff;
            text-decoration: none;
        }

        .topbar-sep {
            color: var(--text-dim);
            font-size: 10px;
        }

        .topbar-page {
            font-size: .85rem;
            color: var(--silver);
            font-weight: 500;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--glass-border);
            color: var(--silver);
            font-size: .8rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all .15s;
        }

        .topbar-btn:hover {
            background: rgba(255, 255, 255, .1);
            color: #fff;
        }

        .topbar-btn i {
            font-size: .85rem;
        }

        .nav-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--glass-border);
        }

        .nav-pill span {
            font-size: .82rem;
            color: var(--silver);
            font-weight: 600;
        }

        .role-badge {
            font-size: .6rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: .7px;
        }

        .role-badge.teacher,
        .role-badge.faculty {
            background: var(--purple-dim);
            color: var(--purple);
        }

        .role-badge.student {
            background: var(--cyan-dim);
            color: var(--cyan);
        }

        /* MAIN */
        .main {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 18px 80px;
        }

        @media(min-width:768px) {
            .main {
                padding: 32px 28px 90px;
            }
        }

        /* CARD */
        .card {
            background: #0f0f0f;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 18px;
        }

        .card-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            font-size: .95rem;
            color: #fff;
            margin-bottom: 16px;
            gap: 8px;
        }

        .card-title i {
            color: var(--cyan);
            margin-right: 6px;
        }

        .btn-icon-small {
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--glass-border);
            color: var(--silver);
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .15s;
            font-size: .75rem;
        }

        .btn-icon-small:hover {
            background: rgba(255, 255, 255, .12);
            color: #fff;
        }

        /* WELCOME BANNER */
        .welcome {
            padding: 24px;
            background: linear-gradient(135deg, rgba(0, 212, 255, .06), rgba(168, 85, 247, .04));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            margin-bottom: 22px;
        }

        .welcome h1 {
            font-family: 'Sora', sans-serif;
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            font-weight: 800;
            margin-bottom: 6px;
        }

        .welcome h1 i {
            color: var(--cyan);
            margin-right: 8px;
        }

        .welcome p {
            font-size: .85rem;
            color: var(--silver);
            line-height: 1.7;
        }

        .welcome-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #4a90f5, #8b6fff);
            border: none;
            color: #fff;
            font-size: .82rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(74, 144, 245, .2);
            transition: all .15s;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(74, 144, 245, .3);
        }

        .btn-glass {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--glass-border);
            color: var(--silver);
            font-size: .82rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: all .15s;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, .1);
            color: #fff;
        }

        /* UPLOAD ZONE */
        .upload-zone {
            border: 2px dashed rgba(0, 212, 255, .25);
            border-radius: var(--radius-md);
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all .2s;
            background: rgba(0, 212, 255, .03);
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--cyan);
            background: rgba(0, 212, 255, .06);
        }

        .upload-zone i {
            font-size: 2.5rem;
            color: var(--cyan);
            opacity: .5;
            margin-bottom: 10px;
            display: block;
        }

        .upload-zone h3 {
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .upload-zone p {
            color: var(--text-dim);
            font-size: .8rem;
        }

        /* FORM */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 14px;
        }

        @media(max-width:600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group label {
            display: block;
            font-size: .72rem;
            font-weight: 700;
            color: var(--silver);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: .7px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, .04);
            color: #fff;
            font-size: .85rem;
            font-family: inherit;
            outline: none;
            transition: border-color .15s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--cyan);
        }

        .form-group select option {
            background: #0f0f0f;
            color: #fff;
        }

        /* PREVIEW */
        .preview-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }

        .ps {
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .03);
            border: 1px solid var(--glass-border);
        }

        .ps .v {
            font-size: 1.4rem;
            font-weight: 900;
        }

        .ps .l {
            font-size: .6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .8rem;
        }

        .preview-table th {
            text-align: left;
            padding: 8px 10px;
            font-size: .68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--glass-border);
        }

        .preview-table td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
            color: var(--silver);
        }

        .preview-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* EXAM LIST */
        .exam-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, .02);
            border: 1px solid var(--glass-border);
            margin-bottom: 8px;
            cursor: pointer;
            transition: all .18s;
        }

        .exam-item:hover {
            border-color: rgba(0, 212, 255, .2);
            background: rgba(0, 212, 255, .03);
        }

        .exam-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: .9rem;
        }

        .exam-info {
            flex: 1;
            min-width: 0;
        }

        .exam-info h4 {
            font-size: .88rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .exam-info .meta {
            font-size: .7rem;
            color: var(--text-dim);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .exam-info .meta i {
            margin-right: 3px;
            font-size: .6rem;
        }

        .type-badge {
            font-size: .58rem;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 6px;
            letter-spacing: .4px;
            text-transform: uppercase;
        }

        /* DETAIL VIEW */
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .ag {
            text-align: center;
            padding: 14px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, .03);
            border: 1px solid var(--glass-border);
        }

        .ag .v {
            font-size: 1.5rem;
            font-weight: 900;
        }

        .ag .l {
            font-size: .6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text-dim);
            margin-top: 3px;
        }

        /* GRADE BAR */
        .grade-bar {
            display: flex;
            height: 28px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .grade-bar div {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .6rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: .5px;
        }

        .ranked-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .8rem;
        }

        .ranked-table th {
            text-align: left;
            padding: 8px 10px;
            font-size: .65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--glass-border);
        }

        .ranked-table td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
        }

        /* EMPTY STATE */
        .empty {
            text-align: center;
            padding: 40px 20px;
        }

        .empty i {
            font-size: 2.5rem;
            color: var(--text-dim);
            opacity: .3;
            margin-bottom: 12px;
            display: block;
        }

        .empty h3 {
            font-size: 1rem;
            color: #fff;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .empty p {
            font-size: .82rem;
            color: var(--text-dim);
            max-width: 380px;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* SUCCESS OVERLAY */
        .success-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, .8);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
        }

        .success-overlay.show {
            display: flex;
        }

        .success-box {
            text-align: center;
            animation: popIn .4s ease;
        }

        .success-box .check {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--green-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 2rem;
            color: var(--green);
        }

        .success-box h2 {
            font-family: 'Sora', sans-serif;
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 6px;
        }

        .success-box p {
            color: var(--silver);
            font-size: .85rem;
        }

        @keyframes popIn {
            from {
                transform: scale(.5);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        /* CONFETTI */
        .confetti-canvas {
            position: fixed;
            inset: 0;
            z-index: 10000;
            pointer-events: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }

        .loading i {
            font-size: 1.5rem;
            margin-bottom: 10px;
            display: block;
        }

        .btn-danger {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(239, 68, 68, .1);
            border: 1px solid rgba(239, 68, 68, .2);
            color: var(--red);
            border-radius: 9px;
            font-size: .78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .15s;
        }

        .btn-danger:hover {
            background: var(--red);
            color: #fff;
        }

        @media(max-width:640px) {
            .main {
                padding: 16px 12px 60px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="cosmos"></div>

    <nav class="topbar">
        <div class="topbar-left">
            <a href="/classroom" style="display:flex;align-items:center;gap:9px;text-decoration:none">
                <img src="/Classgrid.png" alt="Classgrid">
                <span class="topbar-brand">Classgrid</span>
            </a>
            <span class="topbar-sep"><i class="fas fa-chevron-right"></i></span>
            <span class="topbar-page">Marks Manager</span>
        </div>
        <div class="topbar-right">
            <a href="/classroom" class="topbar-btn"><i class="fas fa-arrow-left"></i>Dashboard</a>
            <div class="nav-pill">
                <i class="fas fa-user-circle" style="color:var(--text-dim)"></i>
                <span id="navName">User</span>
                <span id="navRole" class="role-badge">Role</span>
            </div>
        </div>
    </nav>

    <main class="main" id="mainContent">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i>
            <p>Loading...</p>
        </div>
    </main>

    <div class="success-overlay" id="successOverlay">
        <div class="success-box">
            <div class="check"><i class="fas fa-check"></i></div>
            <h2>Marks Saved!</h2>
            <p>All student marks have been recorded.</p>
            <button class="btn-primary" style="margin-top:18px" onclick="hideSuccess()"><i
                    class="fas fa-arrow-left"></i>Back to Exams</button>
        </div>
    </div>

    <script>
        const API = location.hostname === 'localhost' ? 'http://localhost:3000' : location.origin;
        const CID = new URLSearchParams(location.search).get('id');
        let currentUser = null, classroom = null, currentExamId = null;

        function esc(s) { if (!s) return ''; const m = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }; return String(s).replace(/[&<>"']/g, c => m[c]); }

        async function init() {
            const main = document.getElementById('mainContent');
            try {
                const [authR, clsR] = await Promise.all([
                    fetch(`${API}/api/auth/me`, { credentials: 'include' }),
                    CID ? fetch(`${API}/api/classrooms/${CID}`, { credentials: 'include', headers: { 'Content-Type': 'application/json' } }) : null
                ]);
                if (!authR.ok) { location.href = '/login.html'; return; }
                currentUser = await authR.json();

                // Update nav
                document.getElementById('navName').textContent = currentUser.name?.split(' ')[0] || 'User';
                const roleEl = document.getElementById('navRole');
                const dr = (currentUser.role === 'faculty' || currentUser.role === 'teacher') ? 'teacher' : currentUser.role;
                roleEl.textContent = dr === 'teacher' ? 'Faculty' : currentUser.role;
                roleEl.className = `role-badge ${dr}`;

                if (!CID) { main.innerHTML = '<div class="empty"><i class="fas fa-exclamation-triangle"></i><h3>No Classroom</h3><p>Please select a classroom from the dashboard.</p></div>'; return; }
                if (clsR && clsR.ok) { classroom = await clsR.json(); }

                renderUploadView();
            } catch (e) {
                main.innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle"></i><h3>Error</h3><p>${esc(e.message)}</p></div>`;
            }
        }

        function renderUploadView() {
            const main = document.getElementById('mainContent');
            const clsName = classroom?.classroom?.name || classroom?.name || 'Classroom';

            main.innerHTML = `
                <div class="welcome">
                    <h1><i class="fas fa-file-excel"></i> Marks Manager</h1>
                    <p>Upload Excel files with student marks for <strong>${esc(clsName)}</strong>. The system will automatically match students by PRN and calculate analytics.</p>
                    <div class="welcome-actions">
                        <a href="/classroom" class="btn-glass"><i class="fas fa-arrow-left"></i>Back to Dashboard</a>
                        <button class="btn-glass" onclick="downloadTemplate()"><i class="fas fa-download"></i>Download Template</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title"><div><i class="fas fa-upload"></i> Upload Result File</div></div>
                    <div id="uploadSection">
                        <div class="form-group" style="margin-bottom:16px;">
                            <label style="font-weight:600;margin-bottom:8px;display:block;">Select Assigned Exam <span style="color:var(--red)">*</span></label>
                            <select id="pendingExamSelect" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--glass-border);background:var(--bg);color:var(--text);">
                                <option value="">Loading exams...</option>
                            </select>
                        </div>
                        <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()" style="margin-top:10px;">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <h3>Drop Excel file here or click to browse</h3>
                            <p>Select an exam above, then upload the marks Excel file (.xlsx)</p>
                        </div>
                        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleFile(this.files[0])">
                    </div>
                    <div id="previewSection" style="display:none"></div>
                </div>

                <div class="card">
                    <div class="card-title"><div><i class="fas fa-list"></i> Uploaded Exams</div><button class="btn-icon-small" onclick="loadExams()"><i class="fas fa-sync-alt"></i></button></div>
                    <div id="examList"><div class="loading"><i class="fas fa-spinner fa-spin"></i></div></div>
                </div>

                <div class="card" id="examDetailCard" style="display:none">
                    <div class="card-title"><div><i class="fas fa-chart-bar"></i> Exam Details</div><button class="btn-icon-small" onclick="closeDetail()"><i class="fas fa-times"></i></button></div>
                    <div id="examDetail"></div>
                </div>`;

            // Drag-and-drop
            const dz = document.getElementById('dropZone');
            dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
            dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
            dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });

            loadPendingExams();
            loadExams();
        }

        async function loadPendingExams() {
            const sel = document.getElementById('pendingExamSelect');
            if (!sel) return;
            try {
                const r = await fetch(`${API}/api/marks/classroom-exams/${CID}`, { credentials: 'include' });
                if (r.ok) {
                    const data = await r.json();
                    sel.innerHTML = '<option value="">Select an exam...</option>';
                    const drafts = (data.exams || []).filter(e => e.status === 'draft');
                    if (drafts.length === 0) {
                        sel.innerHTML = '<option value="" disabled>No pending exams to upload</option>';
                    } else {
                        drafts.forEach(e => {
                            sel.innerHTML += `<option value="${e._id}">${esc(e.title)}</option>`;
                        });
                    }
                }
            } catch (e) { console.error(e); }
        }

        async function handleFile(file) {
            if (!file) return;
            const examId = document.getElementById('pendingExamSelect')?.value;
            if (!examId) { alert('Please select an exam first'); return; }

            const fd = new FormData();
            fd.append('file', file);

            const preview = document.getElementById('previewSection');
            preview.style.display = 'block';
            preview.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Processing Excel file...</p></div>';
            document.getElementById('uploadSection').style.display = 'none';

            try {
                const r = await fetch(`${API}/api/marks/upload-multi/${examId}`, { method: 'POST', credentials: 'include', body: fd });
                const data = await r.json();
                if (!r.ok) throw new Error(data.message || 'Upload failed');

                currentExamId = data.examId || examId;
                const stats = data.stats || {};
                const matched = data.matched || [];
                const unmatched = data.unmatched || [];

                let html = `<div class="preview-stats">
                    <div class="ps"><div class="v" style="color:var(--green)">${stats.matched || matched.length}</div><div class="l">Matched</div></div>
                    <div class="ps"><div class="v" style="color:var(--red)">${stats.unmatched || unmatched.length}</div><div class="l">Unmatched</div></div>
                </div>`;

                if (matched.length) {
                    html += `<h4 style="font-size:.82rem;color:var(--green);font-weight:700;margin-bottom:8px"><i class="fas fa-check-circle"></i> Matched Students</h4>
                    <div style="max-height:250px;overflow-y:auto;margin-bottom:14px;border-radius:10px;border:1px solid var(--glass-border)">
                    <table class="preview-table"><thead><tr><th>#</th><th>Name</th><th>PRN</th><th>Total</th></tr></thead><tbody>
                    ${matched.map((m, i) => `<tr><td>${i + 1}</td><td>${esc(m.studentName)}</td><td>${esc(m.prn)}</td><td style="font-weight:700;color:var(--cyan)">${m.totalObtained}/${m.totalMax}</td></tr>`).join('')}
                    </tbody></table></div>`;
                }

                if (unmatched.length) {
                    html += `<h4 style="font-size:.82rem;color:var(--red);font-weight:700;margin-bottom:8px"><i class="fas fa-exclamation-circle"></i> Unmatched Rows</h4>
                    <div style="max-height:200px;overflow-y:auto;margin-bottom:14px;border-radius:10px;border:1px solid var(--glass-border)">
                    <table class="preview-table"><thead><tr><th>PRN/ID</th><th>Name</th><th>Reason</th></tr></thead><tbody>
                    ${unmatched.map(u => `<tr><td>${esc(u.prn || u.identifier || '-')}</td><td>${esc(u.name || '-')}</td><td style="color:var(--red)">${esc(u.reason || 'Not found')}</td></tr>`).join('')}
                    </tbody></table></div>`;
                }

                html += `<div class="preview-actions">
                    <button class="btn-primary" onclick="confirmMarks()"><i class="fas fa-check"></i> Confirm & Save ${matched.length} Marks</button>
                    <button class="btn-glass" onclick="cancelUpload()"><i class="fas fa-times"></i> Cancel</button>
                </div>`;

                preview.innerHTML = html;
            } catch (e) {
                preview.innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle"></i><h3>Upload Failed</h3><p>${esc(e.message)}</p></div>
                <div style="text-align:center;margin-top:12px"><button class="btn-glass" onclick="cancelUpload()"><i class="fas fa-arrow-left"></i> Try Again</button></div>`;
            }
        }

        async function confirmMarks() {
            if (!currentExamId) return;
            try {
                // Now hitting the confirm-multi endpoint
                const r = await fetch(`${API}/api/marks/confirm-multi/${currentExamId}`, { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' } });
                if (!r.ok) { const d = await r.json(); throw new Error(d.message); }
                showSuccess();
                loadExams();
                loadPendingExams();
            } catch (e) { alert('Error: ' + e.message); }
        }

        function cancelUpload() {
            document.getElementById('previewSection').style.display = 'none';
            document.getElementById('uploadSection').style.display = 'block';
            currentExamId = null;
        }

        async function loadExams() {
            const el = document.getElementById('examList');
            if (!el) return;
            el.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i></div>';
            try {
                const r = await fetch(`${API}/api/marks/classroom/${CID}`, { credentials: 'include', headers: { 'Content-Type': 'application/json' } });
                const data = await r.json();
                if (!r.ok) {
                    if (r.status === 403) { el.innerHTML = '<div class="empty"><i class="fas fa-lock"></i><h3>Pro Feature</h3><p>Marks & Analytics requires the Pro plan.</p></div>'; return; }
                    throw new Error(data.message);
                }
                const exams = data.exams || [];
                if (!exams.length) { el.innerHTML = '<div class="empty"><i class="fas fa-file-excel"></i><p>No exams uploaded yet.</p></div>'; return; }

                const TYPE_LABELS = { unit_test: 'Unit Test', assignment: 'Assignment', midterm: 'Midterm', final: 'Final', practical: 'Practical', other: 'Other' };
                const TYPE_COLORS = { unit_test: 'var(--cyan)', assignment: 'var(--purple)', midterm: 'var(--green)', final: 'var(--red)', practical: 'var(--orange)', other: 'var(--text-dim)' };

                el.innerHTML = exams.map(e => {
                    const d = new Date(e.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
                    const tc = TYPE_COLORS[e.examType] || 'var(--text-dim)';
                    return `<div class="exam-item" onclick="openDetail('${e._id}')">
                        <div class="exam-icon" style="background:${tc}15"><i class="fas fa-file-alt" style="color:${tc}"></i></div>
                        <div class="exam-info">
                            <h4>${esc(e.title)}</h4>
                            <div class="meta"><span><i class="fas fa-calendar"></i>${d}</span><span><i class="fas fa-star"></i>Out of ${e.totalMarks}</span><span><i class="fas fa-chart-line"></i>Avg: ${e.analytics?.classAverage || 0}</span><span><i class="fas fa-users"></i>${e.mappingStats?.matched || 0} students</span></div>
                        </div>
                        <span class="type-badge" style="background:${tc}15;color:${tc};border:1px solid ${tc}25">${TYPE_LABELS[e.examType] || e.examType}</span>
                    </div>`;
                }).join('');
            } catch (e) { el.innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle"></i><p>${esc(e.message)}</p></div>`; }
        }

        async function openDetail(examId) {
            const card = document.getElementById('examDetailCard');
            const el = document.getElementById('examDetail');
            card.style.display = 'block';
            el.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i></div>';
            card.scrollIntoView({ behavior: 'smooth' });

            try {
                const r = await fetch(`${API}/api/marks/exam/${examId}`, { credentials: 'include', headers: { 'Content-Type': 'application/json' } });
                const data = await r.json();
                if (!r.ok) throw new Error(data.message);

                const a = data.analytics || {};
                const marks = data.marks || [];
                const gradeColors = { A: 'var(--green)', B: 'var(--cyan)', C: 'var(--orange)', D: '#f97316', F: 'var(--red)' };

                let html = `<h3 style="font-size:1rem;font-weight:800;margin-bottom:14px">${esc(data.title)}</h3>
                <div class="analytics-grid">
                    <div class="ag"><div class="v" style="color:var(--cyan)">${a.classAverage || 0}</div><div class="l">Average</div></div>
                    <div class="ag"><div class="v" style="color:var(--green)">${a.highest || 0}</div><div class="l">Highest</div></div>
                    <div class="ag"><div class="v" style="color:var(--red)">${a.lowest || 0}</div><div class="l">Lowest</div></div>
                    <div class="ag"><div class="v" style="color:var(--purple)">${a.median || 0}</div><div class="l">Median</div></div>
                    <div class="ag"><div class="v" style="color:var(--orange)">${a.passRate || 0}%</div><div class="l">Pass Rate</div></div>
                    <div class="ag"><div class="v" style="color:var(--silver)">${a.standardDeviation || 0}</div><div class="l">Std Dev</div></div>
                </div>`;

                // Grade distribution bar
                const gd = a.gradeDistribution || {};
                const total = marks.length || 1;
                html += '<div class="grade-bar">';
                ['A', 'B', 'C', 'D', 'F'].forEach(g => {
                    const pct = ((gd[g] || 0) / total * 100);
                    if (pct > 0) html += `<div style="width:${pct}%;background:${gradeColors[g]}">${g} ${Math.round(pct)}%</div>`;
                });
                html += '</div>';

                // Ranked table
                html += `<div style="max-height:400px;overflow-y:auto;border-radius:10px;border:1px solid var(--glass-border)">
                <table class="ranked-table"><thead><tr><th>#</th><th>Name</th><th>PRN</th><th>Marks</th><th>%</th><th>Grade</th></tr></thead><tbody>
                ${marks.map(m => `<tr><td style="font-weight:700;color:var(--cyan)">${m.rank}</td><td>${esc(m.studentName || 'Unknown')}</td><td style="color:var(--text-dim)">${esc(m.prn || '-')}</td><td style="font-weight:700">${m.marksObtained}</td><td>${m.percentage}%</td><td style="color:${gradeColors[m.grade] || 'var(--silver)'};font-weight:800">${m.grade}</td></tr>`).join('')}
                </tbody></table></div>`;

                html += `<div style="margin-top:16px;display:flex;gap:10px;justify-content:center">
                    <button class="btn-danger" onclick="deleteExam('${examId}')"><i class="fas fa-trash"></i> Delete Exam</button>
                    <button class="btn-glass" onclick="closeDetail()"><i class="fas fa-times"></i> Close</button>
                </div>`;

                el.innerHTML = html;
            } catch (e) { el.innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle"></i><p>${esc(e.message)}</p></div>`; }
        }

        function closeDetail() { document.getElementById('examDetailCard').style.display = 'none'; }

        async function deleteExam(id) {
            if (!confirm('Delete this exam and all its marks?')) return;
            try {
                const r = await fetch(`${API}/api/marks/exam/${id}`, { method: 'DELETE', credentials: 'include' });
                if (!r.ok) { const d = await r.json(); throw new Error(d.message); }
                closeDetail();
                loadExams();
            } catch (e) { alert(e.message); }
        }

        async function downloadTemplate() {
            try { window.open(`${API}/api/marks/download-template`, '_blank'); } catch (e) { alert(e.message); }
        }

        function showSuccess() {
            const overlay = document.getElementById('successOverlay');
            overlay.classList.add('show');
            cancelUpload();
            // Confetti
            const canvas = document.createElement('canvas');
            canvas.className = 'confetti-canvas';
            document.body.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const pieces = Array.from({ length: 120 }, () => ({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height,
                w: Math.random() * 8 + 4, h: Math.random() * 6 + 3,
                color: ['#00d4ff', '#a855f7', '#10b981', '#f97316', '#ec4899', '#fbbf24'][Math.floor(Math.random() * 6)],
                vy: Math.random() * 3 + 2, vx: (Math.random() - .5) * 2, rot: Math.random() * 360, rv: Math.random() * 6 - 3
            }));
            let frame = 0;
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.y += p.vy; p.x += p.vx; p.rot += p.rv;
                    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
                    ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
                });
                frame++;
                if (frame < 180) requestAnimationFrame(draw);
                else canvas.remove();
            }
            draw();
        }

        function hideSuccess() {
            document.getElementById('successOverlay').classList.remove('show');
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    </script>
</body>

</html>
