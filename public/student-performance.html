    <style>
        /* WebView Fix: prevent horizontal overflow */
        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100%;
        }
        :root {
            --bg-deep: #050a18;
            --bg-primary: #0a1628;
            --bg-secondary: #0d1f3c;
            --bg-card: rgba(13, 31, 60, 0.55);

            --cyan-dim: rgba(0, 212, 255, 0.15);
            --purple: #a855f7;
            --purple-dim: rgba(168, 85, 247, 0.15);
            --green: #10b981;
            --green-dim: rgba(16, 185, 129, 0.15);
            --red: #ef4444;
            --red-dim: rgba(239, 68, 68, 0.15);
            --orange: #f97316;
            --white: #f1f5f9;

        }

        html {
            overflow-x: hidden;
        }

        body {
            font-family: 'DM Sans', 'Inter', sans-serif;

        .cosmos {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(ellipse at 20% 50%, rgba(10, 30, 80, .4) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(100, 40, 200, .15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(0, 212, 255, .08) 0%, transparent 50%),

        }

        .cosmos::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 10% 20%, rgba(255, 255, 255, .4) 0%, transparent 100%),
                radial-gradient(1px 1px at 30% 60%, rgba(255, 255, 255, .3) 0%, transparent 100%),
                radial-gradient(1px 1px at 50% 10%, rgba(255, 255, 255, .5) 0%, transparent 100%),
                radial-gradient(1px 1px at 70% 80%, rgba(255, 255, 255, .3) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 40%, rgba(255, 255, 255, .4) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 15% 85%, rgba(0, 212, 255, .6) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 85% 15%, rgba(168, 85, 247, .5) 0%, transparent 100%);
            animation: twinkle 8s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: .6
            }

            100% {
                opacity: 1
            }
        }

        .topbar {

            top: 0;
            z-index: 100;

        /* ── PDF Result Sheet (hidden, used for PDF generation) ── */
        #resultSheet {
            position: absolute;
            left: -9999px;
            top: 0;
            width: 210mm;
            background: #fff;
        }

        #resultSheet.visible {

        /* Result Sheet Overlay */
        .rs-overlay {
            display: none;

            z-index: 9998;
            background: rgba(0, 0, 0, .85);

            text-align: center;

        /* Student Info */
        .rs-student {

<body>
    <div class="cosmos"></div>

    <nav class="topbar">
        <div class="topbar-left">
            <a href="/classroom" style="display:flex;align-items:center;gap:9px;text-decoration:none">
                <img src="/Classgrid.png" alt="Classgrid">
                <span class="topbar-brand">Classgrid</span>
            </a>
            <span class="topbar-sep"><i class="fas fa-chevron-right"></i></span>
            <span class="topbar-page">My Performance</span>
        </div>
        <div class="topbar-right">
            <a href="/classroom" class="topbar-btn"><i class="fas fa-arrow-left"></i>Dashboard</a>
            <div class="nav-pill">
                <i class="fas fa-user-circle" style="color:var(--text-dim)"></i>
                <span id="navName">User</span>
                <span id="navRole" class="role-badge student">Student</span>
            </div>
        </div>
    </nav>

    <main class="main" id="mainContent">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i>
            <p>Loading your results...</p>
        </div>
    </main>

    <!-- Result Sheet Overlay -->
    <div class="rs-overlay" id="rsOverlay">
        <div class="rs-overlay-actions">
            <button class="btn-primary" onclick="downloadPDF()" id="downloadBtn"><i class="fas fa-download"></i>Download
                PDF</button>
            <button class="btn-glass" onclick="closeResultSheet()" style="color:#fff"><i
                    class="fas fa-times"></i>Close</button>
        </div>
        <div id="resultSheet"></div>
    </div>

    <script>
        const API = location.hostname === 'localhost' ? 'http://localhost:3000' : location.origin;
        let cachedData = null; // Store API data for result sheet generation

        function esc(s) { if (!s) return ''; const m = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }; return String(s).replace(/[&<>"']/g, c => m[c]); }

        async function init() {
            const main = document.getElementById('mainContent');
            try {
                const authR = await fetch(`${API}/api/auth/me`, { credentials: 'include' });
                if (!authR.ok) { location.href = '/login.html'; return; }
                const user = await authR.json();

                document.getElementById('navName').textContent = user.name?.split(' ')[0] || 'User';
                const roleEl = document.getElementById('navRole');
                const dr = (user.role === 'faculty' || user.role === 'teacher') ? 'teacher' : user.role;
                roleEl.textContent = dr === 'teacher' ? 'Faculty' : user.role;
                roleEl.className = `role-badge ${dr}`;

                const marksR = await fetch(`${API}/api/marks/student/me`, { credentials: 'include', headers: { 'Content-Type': 'application/json' } });
                const data = await marksR.json();

                if (!marksR.ok) {
                    if (marksR.status === 403) {
                        main.innerHTML = `<div class="welcome"><h1><i class="fas fa-lock"></i>Pro Feature</h1><p>Marks & Analytics requires the Pro plan. Ask your organization admin to upgrade.</p>
                            <div class="welcome-actions"><a href="/classroom" class="btn-glass"><i class="fas fa-arrow-left"></i>Back to Dashboard</a></div></div>`;
                        return;
                    }
                    throw new Error(data.message);
                }

                const { totalExams, classrooms, organization, student } = data;
                cachedData = data; // Cache for PDF

                if (!totalExams || !classrooms?.length) {
                    main.innerHTML = `<div class="welcome"><h1><i class="fas fa-chart-bar"></i>My Performance</h1><p>No exam results have been uploaded yet. Your marks will appear here once your teachers upload them.</p>
                        <div class="welcome-actions"><a href="/classroom" class="btn-glass"><i class="fas fa-arrow-left"></i>Back to Dashboard</a></div></div>`;
                    return;
                }

                // Calculate overall stats
                let totalObt = 0, totalMax = 0, bestPct = 0, passCount = 0, totalM = 0;
                for (const cls of classrooms) {
                    for (const m of cls.marks) {
                        totalObt += m.marksObtained;
                        totalMax += m.totalMarks;
                        if (m.percentage > bestPct) bestPct = m.percentage;
                        if (m.isPassed) passCount++;
                        totalM++;
                    }
                }
                const overallPct = totalMax > 0 ? Math.round((totalObt / totalMax) * 100) : 0;
                const pctCol = overallPct >= 75 ? '--green' : overallPct >= 60 ? '--orange' : '--red';

                const gradeColors = { A: 'var(--green)', B: 'var(--cyan)', C: 'var(--orange)', D: '#f97316', F: 'var(--red)' };
                const typeLabels = { unit_test: 'Unit Test', assignment: 'Assignment', midterm: 'Midterm', final: 'Final', practical: 'Practical', other: 'Other' };

                let html = `
                <div class="welcome">
                    <h1><i class="fas fa-chart-bar"></i>My Performance</h1>
                    <p>Your academic results across ${classrooms.length} classroom${classrooms.length > 1 ? 's' : ''}. ${totalExams} exam${totalExams > 1 ? 's' : ''} recorded.</p>
                    <div class="welcome-actions">
                        <button class="btn-primary" onclick="showResultSheet()"><i class="fas fa-file-pdf"></i>Download Result Sheet</button>
                        <a href="/classroom" class="btn-glass"><i class="fas fa-arrow-left"></i>Back to Dashboard</a>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat"><div class="v" style="color:var(--cyan)">${totalExams}</div><div class="l">Total Exams</div></div>
                    <div class="stat"><div class="v" style="color:var(${pctCol})">${overallPct}%</div><div class="l">Average</div></div>
                    <div class="stat"><div class="v" style="color:var(--orange)">${bestPct}%</div><div class="l">Best Score</div></div>
                    <div class="stat"><div class="v" style="color:var(--purple)">${passCount}/${totalM}</div><div class="l">Passed</div></div>
                </div>`;

                // Group by classroom
                for (const cls of classrooms) {
                    html += `<div class="card">
                        <div class="card-title"><div><i class="fas fa-school"></i>${esc(cls.classroomName)}</div><span style="font-size:.6rem;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--cyan-dim);color:var(--cyan);text-transform:uppercase;letter-spacing:.5px">${cls.marks.length} exam${cls.marks.length > 1 ? 's' : ''}</span></div>`;

                    cls.marks.forEach((m, i) => {
                        const gc = gradeColors[m.grade] || 'var(--text-dim)';
                        const pp = m.isPassed;
                        const hasSubjects = m.subjectMarks && m.subjectMarks.length > 0;
                        let subjHtml = '';
                        if (hasSubjects) {
                            subjHtml = `<div style="margin-top:8px;padding:8px 12px;background:rgba(255,255,255,.03);border:1px solid var(--glass-border);border-radius:8px;display:flex;flex-wrap:wrap;gap:6px">`;
                            m.subjectMarks.forEach(sm => {
                                const smPct = Math.round((sm.marksObtained / sm.maxMarks) * 100);
                                const smCol = smPct >= 75 ? 'var(--green)' : smPct >= 60 ? 'var(--orange)' : 'var(--red)';
                                subjHtml += `<span style="font-size:.68rem;padding:3px 8px;border-radius:6px;background:${smCol}18;color:${smCol};font-weight:600">${esc(sm.subjectName)}: ${sm.marksObtained}/${sm.maxMarks}</span>`;
                            });
                            subjHtml += `</div>`;
                        }
                        html += `<div class="mark-card" style="animation-delay:${i * 0.06}s;flex-direction:column;align-items:stretch">
                            <div style="display:flex;align-items:center;gap:14px">
                            <div class="grade-circle" style="background:${gc}18;color:${gc}">${m.grade}</div>
                            <div class="mark-info">
                                <h4>${esc(m.examTitle)}</h4>
                                <div class="meta">
                                    <span><i class="fas fa-tag"></i>${typeLabels[m.examType] || m.examType}</span>
                                    <span><i class="fas fa-percentage"></i>${m.percentage}%</span>
                                    ${hasSubjects ? `<span><i class="fas fa-book"></i>${m.subjectMarks.length} subjects</span>` : ''}
                                </div>
                            </div>
                            <div class="mark-right">
                                <div class="score" style="color:#fff">${m.marksObtained}<span style="font-size:.7rem;color:var(--text-dim);font-weight:400">/${m.totalMarks}</span></div>
                                <div class="rank-pill" style="color:${pp ? 'var(--green)' : 'var(--red)'}">#${m.rank} · ${pp ? 'PASS' : 'FAIL'}</div>
                            </div>
                            </div>
                            ${subjHtml}
                        </div>`;
                    });

                    html += '</div>';
                }

                main.innerHTML = html;

            } catch (e) {
                main.innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle"></i><h3>Error</h3><p>${esc(e.message)}</p></div>`;
            }
        }

        // ══════════════════════════════════════════════════════
        // PROFESSIONAL RESULT SHEET GENERATION
        // ══════════════════════════════════════════════════════

        function showResultSheet() {
            if (!cachedData) return;
            const { classrooms, organization, student, totalExams } = cachedData;
            const orgName = organization?.name || 'Educational Institution';
            const orgLogo = organization?.logoUrl || '';
            const orgAddress = organization?.address || '';
            const studentName = student?.name || 'Student';
            const studentPrn = student?.prn || '-';
            const studentEmail = student?.email || '';
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });

            const typeLabels = { unit_test: 'Unit Test', assignment: 'Assignment', midterm: 'Midterm', final: 'Final', practical: 'Practical', other: 'Other' };

            // Calculate totals
            let totalObt = 0, totalMax = 0, passCount = 0, totalM = 0;
            for (const cls of classrooms) {
                for (const m of cls.marks) {
                    totalObt += m.marksObtained;
                    totalMax += m.totalMarks;
                    if (m.isPassed) passCount++;
                    totalM++;
                }
            }
            const overallPct = totalMax > 0 ? Math.round((totalObt / totalMax) * 100) : 0;
            const overallGrade = overallPct >= 90 ? 'A' : overallPct >= 75 ? 'B' : overallPct >= 60 ? 'C' : overallPct >= 45 ? 'D' : 'F';
            const overallStatus = passCount === totalM ? 'PASSED' : `${passCount}/${totalM} PASSED`;

            // Build the result sheet HTML (white, print-friendly theme)
            let rs = `<div class="rs">
                <!-- HEADER -->
                <div class="rs-header">
                    ${orgLogo ? `<img src="${esc(orgLogo)}" class="rs-logo" alt="Institute Logo" onerror="this.style.display='none'">` : `<div style="width:64px;height:64px;border-radius:50%;background:#1e293b;display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px"><i class="fas fa-university" style="font-size:28px;color:#94a3b8"></i></div>`}
                    <div class="rs-inst">${esc(orgName)}</div>
                    ${orgAddress ? `<div class="rs-addr">${esc(orgAddress)}</div>` : ''}
                    <div class="rs-exam-title"><i class="fas fa-scroll" style="margin-right:6px"></i>Statement of Marks</div>
                </div>

                <!-- STUDENT INFO -->
                <div class="rs-student">
                    <div><span class="label">Student Name</span><br><span class="val">${esc(studentName)}</span></div>
                    <div><span class="label">PRN / Roll No</span><br><span class="val">${esc(studentPrn)}</span></div>
                    <div><span class="label">Total Exams</span><br><span class="val">${totalExams}</span></div>
                    <div><span class="label">Date Issued</span><br><span class="val">${dateStr}</span></div>
                </div>`;

            // Build marks table — one section per classroom
            let slNo = 1;
            for (const cls of classrooms) {
                rs += `<div style="margin-bottom:16px">
                    <div style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:6px;padding:4px 10px;background:#f1f5f9;border-radius:6px;border-left:3px solid #2563eb">
                        <i class="fas fa-school" style="color:#2563eb;margin-right:6px;font-size:11px"></i>${esc(cls.classroomName)}${cls.subject ? ' — ' + esc(cls.subject) : ''}
                    </div>`;

                for (const m of cls.marks) {
                    const hasSubjects = m.subjectMarks && m.subjectMarks.length > 0;

                    if (hasSubjects) {
                        // Multi-subject: show Subject | Marks table
                        rs += `<div style="margin-bottom:12px;padding:8px 0">
                            <div style="font-size:12px;font-weight:700;color:#2563eb;margin-bottom:6px">${esc(m.examTitle)} <span style="font-size:10px;color:#64748b;font-weight:500">(${typeLabels[m.examType] || m.examType})</span></div>
                            <table class="rs-table">
                                <thead><tr><th>Subject</th><th style="text-align:center">Marks</th><th style="text-align:center">Max</th><th style="text-align:center">%</th></tr></thead>
                                <tbody>`;
                        m.subjectMarks.forEach(sm => {
                            const smPct = Math.round((sm.marksObtained / sm.maxMarks) * 100);
                            rs += `<tr>
                                <td style="font-weight:600">${esc(sm.subjectName)}</td>
                                <td style="text-align:center;font-weight:700">${sm.marksObtained}</td>
                                <td style="text-align:center">${sm.maxMarks}</td>
                                <td style="text-align:center">${smPct}%</td>
                            </tr>`;
                        });
                        rs += `<tr style="background:#f1f5f9;font-weight:800">
                                <td>Total</td>
                                <td style="text-align:center">${m.marksObtained}</td>
                                <td style="text-align:center">${m.totalMarks}</td>
                                <td style="text-align:center">${m.percentage}%</td>
                            </tr>
                            </tbody></table>
                            <div style="display:flex;gap:12px;margin-top:4px;font-size:11px">
                                <span class="rs-grade rs-grade-${m.grade}">Grade: ${m.grade}</span>
                                <span class="${m.isPassed ? 'rs-pass' : 'rs-fail'}">${m.isPassed ? 'PASS' : 'FAIL'}</span>
                                <span style="color:#64748b">Rank: #${m.rank}</span>
                            </div>
                        </div>`;
                    } else {
                        // Legacy single row
                        if (slNo === 1) {
                            rs += `<table class="rs-table">
                                <thead><tr><th>Sl.</th><th>Examination</th><th>Type</th><th>Marks Obtained</th><th>Total Marks</th><th>Percentage</th><th>Grade</th><th>Status</th></tr></thead>
                                <tbody>`;
                        }
                        rs += `<tr>
                            <td>${slNo}</td>
                            <td style="font-weight:600">${esc(m.examTitle)}</td>
                            <td>${typeLabels[m.examType] || m.examType}</td>
                            <td style="font-weight:700;text-align:center">${m.marksObtained}</td>
                            <td style="text-align:center">${m.totalMarks}</td>
                            <td style="text-align:center">${m.percentage}%</td>
                            <td style="text-align:center" class="rs-grade rs-grade-${m.grade}">${m.grade}</td>
                            <td class="${m.isPassed ? 'rs-pass' : 'rs-fail'}">${m.isPassed ? 'PASS' : 'FAIL'}</td>
                        </tr>`;
                    }
                    slNo++;
                }

                rs += '</div>';
            }

            // Summary boxes
            rs += `<div class="rs-summary">
                <div class="rs-sum-box"><div class="rs-sum-v">${totalObt}</div><div class="rs-sum-l">Marks Obtained</div></div>
                <div class="rs-sum-box"><div class="rs-sum-v">${totalMax}</div><div class="rs-sum-l">Total Marks</div></div>
                <div class="rs-sum-box"><div class="rs-sum-v">${overallPct}%</div><div class="rs-sum-l">Percentage</div></div>
                <div class="rs-sum-box"><div class="rs-sum-v rs-grade rs-grade-${overallGrade}">${overallGrade}</div><div class="rs-sum-l">Overall Grade</div></div>
            </div>

            <div style="text-align:center;padding:8px 14px;background:${overallPct >= 45 ? '#f0fdf4' : '#fef2f2'};border:1px solid ${overallPct >= 45 ? '#bbf7d0' : '#fecaca'};border-radius:8px;margin-bottom:20px;font-weight:800;font-size:13px;color:${overallPct >= 45 ? '#166534' : '#991b1b'};letter-spacing:.5px">
                ${overallStatus}
            </div>

            <!-- FOOTER -->
            <div class="rs-footer">
                <div class="rs-gen">
                    <strong>Generated by Classgrid</strong><br>
                    <span>Date: ${dateStr} | This is a computer-generated document.</span>
                </div>
                <div class="rs-watermark">classgrid.vercel.app</div>
            </div>
            </div>`;

            // Inject into overlay
            document.getElementById('resultSheet').innerHTML = rs;
            document.getElementById('rsOverlay').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeResultSheet() {
            document.getElementById('rsOverlay').classList.remove('show');
            document.body.style.overflow = '';
        }

        async function downloadPDF() {
            const btn = document.getElementById('downloadBtn');
            const orig = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>Generating...';
            btn.disabled = true;

            const el = document.getElementById('resultSheet');
            const studentName = cachedData?.student?.name || 'Student';
            const fileName = `${studentName.replace(/\s+/g, '_')}_Result_Sheet.pdf`;

            const opt = {
                margin: [10, 8, 10, 8],
                filename: fileName,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, letterRendering: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
            };

            try {
                await html2pdf().set(opt).from(el).save();
            } catch (e) {
                console.error('PDF generation failed:', e);
                alert('PDF generation failed. Please try again.');
            }

            btn.innerHTML = orig;
            btn.disabled = false;
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    </script>
</body>

</html>
