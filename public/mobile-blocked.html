<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classgrid - Mobile App Required</title>
  <link rel="stylesheet" href="/index.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: var(--color-background-app);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: var(--font-family-sans);
      margin: 0;
      padding: 1.5rem;
    }
    
    .block-container {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 3rem 2rem;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    
    .icon-wrapper {
      width: 80px;
      height: 80px;
      background: rgba(239, 68, 68, 0.1);
      color: var(--color-error);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      margin: 0 auto 1.5rem auto;
    }
    
    h1 {
      font-size: 1.5rem;
      color: var(--color-text);
      margin-bottom: 1rem;
    }
    
    p {
      color: var(--color-text-secondary);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    
    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: var(--color-primary);
      color: white;
      text-decoration: none;
      padding: 0.875rem 1.5rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      width: 100%;
      transition: background 0.2s ease;
    }
    
    .download-btn:hover {
      background: var(--color-primary-dark);
    }
    
    .desktop-notice {
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--color-text-tertiary);
    }
  </style>
</head>
<body>
  <div class="block-container">
    <div class="icon-wrapper">
      <i class="fa-solid fa-mobile-screen-button"></i>
    </div>
    <h1>Mobile App Required</h1>
    <p>To ensure security and support biometric attendance, Classgrid cannot be accessed via a mobile web browser.</p>
    <p>Please download our official Android app to continue on your phone.</p>
    
    <a href="https://cdn.classgrid.in/v2classgrid.apk" class="download-btn">
      <i class="fa-brands fa-android"></i> Download Android App
    </a>
    
    <div class="desktop-notice">
      You can also access the web version using a Desktop or Laptop computer.
    </div>
  </div>
</body>
</html>
