<html lang="en" data-theme="light">

<head>

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Classroom | Classgrid</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            overflow-x: hidden;
            width: 100%;
            max-width: 100%;
        }

        img {
            max-width: 100%
        }

        :root {
            --bg: #f0f4fb;
            --bg2: #ffffff;
            --bg3: #edf1fb;
            --bg4: #dce3f5;
            --bd: rgba(0, 0, 0, .07);
            --bd2: rgba(0, 0, 0, .12);
            --tx: #0b0f1e;
            --tx2: #3d4a6a;
            --mt: #5a6a8e;
            --dm: #94a3c0;
            --ac: #2d6fdf;
            --ac2: #6340d6;
            --gr: #00a87a;
            --rd: #d93545;
            --nav: 60px;
            --r: 14px;
            --f: 'Outfit', sans-serif;
        }

        [data-theme="dark"] {
            --bg: #07080f;
            --bg2: #0e111c;
            --bg3: #151a2b;
            --bg4: #1c2338;
            --bd: rgba(255, 255, 255, .07);
            --bd2: rgba(255, 255, 255, .13);
            --tx: #eef2ff;
            --tx2: #a8b4d0;
            --mt: #5e6e94;
            --dm: #364058;
            --ac: #4f8eff;
            --ac2: #7c5cfc;
            --gr: #00c896;
            --rd: #ff4757;
        }

        body {
            font-family: var(--f);
            background: var(--bg);
            color: var(--tx);
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            font-size: 16px;
        }

        /* BG */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden
        }

        .bg-layer::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(45, 111, 223, .06) 0%, transparent 70%);
            top: -150px;
            right: -120px;
            animation: ga 22s ease-in-out infinite alternate
        }

        .bg-layer::after {
            content: '';
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 64, 214, .04) 0%, transparent 70%);
            bottom: -60px;
            left: -80px;
            animation: gb 28s ease-in-out infinite alternate
        }

        @keyframes ga {
            to {
                transform: translate(-40px, 60px)scale(1.06)
            }
        }

        @keyframes gb {
            to {
                transform: translate(40px, -30px)scale(1.08)
            }
        }

        [data-theme="dark"] .bg-layer::before {
            background: radial-gradient(circle, rgba(79, 142, 255, .06) 0%, transparent 70%)
        }

        [data-theme="dark"] .bg-layer::after {
            background: radial-gradient(circle, rgba(124, 92, 252, .05) 0%, transparent 70%)
        }

        /* NAV */
        .nav {
            position: sticky;
            top: 0;
            width: 100%;
            height: var(--nav);
            z-index: 500;
            background: rgba(255, 255, 255, .97);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(0, 0, 0, .08);
            box-shadow: 0 1px 10px rgba(45, 111, 223, .08);
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 8px;
        }

        [data-theme="dark"] .nav {
            background: rgba(7, 8, 15, .95);
            border-bottom-color: rgba(255, 255, 255, .1);
            box-shadow: 0 1px 10px rgba(0, 0, 0, .4)
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
            flex-shrink: 0
        }

        .logo-img {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid rgba(45, 111, 223, .25);
            box-shadow: 0 2px 10px rgba(45, 111, 223, .18)
        }

        [data-theme="dark"] .logo-img {
            border-color: rgba(79, 142, 255, .3)
        }

        .logo-text {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -.4px;
            color: var(--tx);
            white-space: nowrap
        }

        .logo-text em {
            color: var(--ac);
            font-style: normal
        }

        .nav-sp {
            flex: 1;
            min-width: 0
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0
        }

        .nl {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            color: var(--mt);
            text-decoration: none;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: color .15s, background .15s;
            white-space: nowrap;
            min-height: 42px;
            min-width: 42px;
            touch-action: manipulation;
        }

        .nl:hover {
            color: var(--tx);
            background: var(--bg3)
        }

        .nl i {
            font-size: 15px
        }

        .nl-lbl {
            display: none
        }

        @media(min-width:520px) {
            .nl-lbl {
                display: inline
            }

            .nl {
                padding: 8px 12px
            }
        }

        @media(min-width:768px) {
            .nav {
                padding: 0 22px
            }
        }

        .thm {
            display: flex;
            align-items: center;
            background: var(--bg3);
            border: 1px solid var(--bd2);
            border-radius: 9px;
            padding: 3px;
            gap: 2px;
            margin-left: 4px
        }

        .tb {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            border: none;
            background: transparent;
            cursor: pointer;
            color: var(--mt);
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .15s;
            touch-action: manipulation;
        }

        .tb:hover {
            color: var(--tx)
        }

        .tb.on {
            background: var(--ac);
            color: #fff;
            box-shadow: 0 2px 8px rgba(45, 111, 223, .4)
        }

        /* WRAP */
        .wrap {
            position: relative;
            z-index: 1;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 14px 12px 60px;
            flex: 1
        }

        @media(min-width:480px) {
            .wrap {
                padding: 18px 16px 64px
            }
        }

        @media(min-width:768px) {
            .wrap {
                padding: 26px 22px 72px
            }
        }

        /* HERO */
        .hero {
            position: relative;
            overflow: hidden;
            border-radius: var(--r);
            border: 1px solid var(--bd2);
            background: var(--bg2);
            margin-bottom: 14px;
            box-shadow: 0 2px 14px rgba(45, 111, 223, .09), 0 1px 4px rgba(0, 0, 0, .05)
        }

        [data-theme="dark"] .hero {
            box-shadow: 0 4px 24px rgba(0, 0, 0, .35)
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--ac), var(--ac2), var(--gr));
            z-index: 2
        }

        .hero-glow {
            position: absolute;
            top: -80px;
            right: -60px;
            z-index: 0;
            pointer-events: none;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(45, 111, 223, .07) 0%, transparent 70%)
        }

        [data-theme="dark"] .hero-glow {
            background: radial-gradient(circle, rgba(79, 142, 255, .07) 0%, transparent 70%)
        }

        .hero-top {
            padding: 16px 14px 14px;
            position: relative;
            z-index: 1
        }

        @media(min-width:480px) {
            .hero-top {
                padding: 20px 18px 16px
            }
        }

        @media(min-width:768px) {
            .hero-top {
                padding: 26px 26px 20px
            }
        }

        .htag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--ac);
            background: rgba(45, 111, 223, .08);
            border: 1px solid rgba(45, 111, 223, .2);
            padding: 4px 11px;
            border-radius: 99px;
            margin-bottom: 10px
        }

        [data-theme="dark"] .htag {
            background: rgba(79, 142, 255, .1);
            border-color: rgba(79, 142, 255, .22)
        }

        .htitle {
            font-size: clamp(18px, 5vw, 30px);
            font-weight: 800;
            letter-spacing: -.5px;
            line-height: 1.2;
            color: var(--tx);
            margin-bottom: 9px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px
        }

        .htitle span {
            flex: 1;
            word-break: break-word
        }

        .refr {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border-radius: 9px;
            border: 1px solid var(--bd2);
            background: var(--bg3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--mt);
            transition: all .18s;
            touch-action: manipulation;
        }

        .refr:hover {
            color: var(--ac);
            border-color: rgba(45, 111, 223, .4);
            background: rgba(45, 111, 223, .07)
        }

        [data-theme="dark"] .refr:hover {
            border-color: rgba(79, 142, 255, .4);
            background: rgba(79, 142, 255, .08)
        }

        .hdesc {
            font-size: 13.5px;
            color: var(--tx2);
            line-height: 1.7;
            margin-bottom: 12px
        }

        @media(min-width:480px) {
            .hdesc {
                font-size: 14.5px
            }
        }

        .hstat {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--mt);
            background: var(--bg3);
            border: 1px solid var(--bd);
            padding: 6px 13px;
            border-radius: 9px
        }

        .hstat i {
            font-size: 11px;
            color: var(--ac)
        }

        .inst {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 13px 14px;
            border-top: 1px solid var(--bd);
            background: #f4f7fe;
            position: relative;
            z-index: 1
        }

        @media(min-width:480px) {
            .inst {
                gap: 15px;
                padding: 15px 18px;
                align-items: center
            }
        }

        @media(min-width:768px) {
            .inst {
                padding: 17px 26px;
                gap: 18px
            }
        }

        [data-theme="dark"] .inst {
            background: var(--bg3);
            border-top-color: var(--bd)
        }

        .iav {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--ac), var(--ac2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            overflow: hidden;
            border: 2px solid rgba(45, 111, 223, .25)
        }

        .iav img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .iinfo {
            flex: 1;
            min-width: 0
        }

        .ilbl {
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--dm);
            margin-bottom: 2px
        }

        .iname {
            font-size: 14px;
            font-weight: 700;
            color: var(--tx);
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .imeta {
            display: flex;
            flex-wrap: wrap;
            gap: 3px 12px
        }

        .im {
            font-size: 12px;
            color: var(--mt);
            display: flex;
            align-items: center;
            gap: 5px
        }

        .im i {
            font-size: 10px;
            color: var(--dm)
        }

        .ibio {
            font-size: 12px;
            color: var(--mt);
            font-style: italic;
            margin-top: 4px;
            line-height: 1.5
        }

        /* TABS */
        .tabs {
            display: flex;
            background: var(--bg2);
            border: 1px solid var(--bd2);
            border-radius: var(--r);
            padding: 4px;
            gap: 3px;
            margin-bottom: 14px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            box-shadow: 0 1px 8px rgba(0, 0, 0, .05)
        }

        .tabs::-webkit-scrollbar {
            display: none
        }

        [data-theme="dark"] .tabs {
            box-shadow: none
        }

        .tab {
            flex: 1;
            min-width: max-content;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 11px;
            border: none;
            border-radius: 10px;
            background: transparent;
            cursor: pointer;
            font-family: var(--f);
            font-size: 12.5px;
            font-weight: 600;
            color: var(--mt);
            transition: all .2s;
            white-space: nowrap;
            min-height: 40px;
            touch-action: manipulation;
        }

        .tab i {
            font-size: 12px
        }

        .tab:hover {
            color: var(--tx);
            background: var(--bg3)
        }

        .tab.on {
            background: linear-gradient(135deg, rgba(45, 111, 223, .11), rgba(99, 64, 214, .07));
            color: var(--ac);
            box-shadow: inset 0 0 0 1px rgba(45, 111, 223, .22)
        }

        [data-theme="dark"] .tab.on {
            background: linear-gradient(135deg, rgba(79, 142, 255, .14), rgba(124, 92, 252, .09));
            color: var(--ac);
            box-shadow: inset 0 0 0 1px rgba(79, 142, 255, .22)
        }

        .tn {
            min-width: 18px;
            height: 18px;
            border-radius: 99px;
            background: var(--bg3);
            color: var(--mt);
            font-size: 10px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px
        }

        .tab.on .tn {
            background: rgba(45, 111, 223, .14);
            color: var(--ac)
        }

        [data-theme="dark"] .tab.on .tn {
            background: rgba(79, 142, 255, .18);
            color: var(--ac)
        }

        @media(max-width:360px) {
            .tab {
                font-size: 11.5px;
                padding: 8px 7px
            }

            .tab i {
                display: none
            }

            .tn {
                display: none
            }
        }

        @media(min-width:768px) {
            .tab {
                font-size: 13.5px;
                padding: 10px 16px;
                gap: 7px
            }
        }

        /* PANELS */
        .panel {
            display: none
        }

        .panel.on {
            display: block;
            animation: pi .26s cubic-bezier(.25, .46, .45, .94)
        }

        @keyframes pi {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        /* CARD (announcements/quizzes) */
        .card {
            display: flex;
            gap: 11px;
            align-items: flex-start;
            background: var(--bg2);
            border: 1px solid var(--bd);
            border-radius: var(--r);
            padding: 14px;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
            transition: border-color .2s, box-shadow .2s;
        }

        @media(min-width:480px) {
            .card {
                gap: 14px;
                padding: 16px 18px
            }
        }

        [data-theme="light"] .card {
            background: #fff;
            border-color: rgba(0, 0, 0, .08);
            box-shadow: 0 1px 8px rgba(45, 111, 223, .06)
        }

        .card::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom, var(--ac), var(--ac2));
            opacity: 0;
            transition: opacity .2s
        }

        .card:hover {
            border-color: var(--bd2);
            box-shadow: 0 5px 20px rgba(45, 111, 223, .1)
        }

        .card:hover::after {
            opacity: 1
        }

        [data-theme="dark"] .card:hover {
            box-shadow: 0 5px 20px rgba(0, 0, 0, .35)
        }

        .card-ico {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px
        }

        .ci-p {
            background: rgba(99, 64, 214, .1);
            color: var(--ac2)
        }

        .ci-g {
            background: rgba(0, 168, 122, .1);
            color: var(--gr)
        }

        [data-theme="dark"] .ci-p {
            background: rgba(124, 92, 252, .12)
        }

        [data-theme="dark"] .ci-g {
            background: rgba(0, 200, 150, .1);
            color: var(--gr)
        }

        .cbody {
            flex: 1;
            min-width: 0
        }

        .ctit {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--tx);
            margin-bottom: 5px;
            line-height: 1.35
        }

        .cdesc {
            font-size: 13px;
            color: var(--tx2);
            line-height: 1.7;
            margin-bottom: 10px;
            word-break: break-word
        }

        .cfoot {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap
        }

        .cdate {
            font-size: 11.5px;
            color: var(--mt);
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500
        }

        .cdate i {
            font-size: 9.5px
        }

        .btnd {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 9px;
            font-family: var(--f);
            font-size: 12.5px;
            font-weight: 700;
            background: var(--ac);
            color: #fff;
            text-decoration: none;
            border: none;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 2px 8px rgba(45, 111, 223, .28);
            transition: all .18s;
        }

        .btnd:hover {
            filter: brightness(1.08)
        }

        .btnd i {
            font-size: 11px
        }

        .cops {
            display: flex;
            gap: 4px;
            flex-shrink: 0
        }

        .cop {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            border: 1px solid var(--bd);
            background: transparent;
            cursor: pointer;
            color: var(--dm);
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .15s;
            touch-action: manipulation;
        }

        [data-theme="light"] .cop {
            border-color: var(--bd2);
            color: var(--mt)
        }

        .cop:hover {
            border-color: rgba(45, 111, 223, .4);
            color: var(--ac);
            background: rgba(45, 111, 223, .07)
        }

        .cop.del:hover {
            border-color: rgba(217, 53, 69, .4);
            color: var(--rd);
            background: rgba(217, 53, 69, .07)
        }

        [data-theme="dark"] .cop:hover {
            border-color: rgba(79, 142, 255, .4);
            background: rgba(79, 142, 255, .08)
        }

        [data-theme="dark"] .cop.del:hover {
            border-color: rgba(255, 71, 87, .4);
            background: rgba(255, 71, 87, .07)
        }

        /* MEMBERS */
        .mtop {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 10px;
            flex-wrap: wrap
        }

        .mtop h3 {
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 7px
        }

        .mtop h3 i {
            font-size: 12px;
            color: var(--ac)
        }

        .mbadge {
            font-size: 11px;
            font-weight: 700;
            color: var(--ac);
            background: rgba(45, 111, 223, .08);
            border: 1px solid rgba(45, 111, 223, .18);
            padding: 4px 11px;
            border-radius: 99px
        }

        [data-theme="dark"] .mbadge {
            background: rgba(79, 142, 255, .1);
            border-color: rgba(79, 142, 255, .2)
        }

        .mtable {
            background: var(--bg2);
            border: 1px solid var(--bd2);
            border-radius: var(--r);
            overflow: hidden;
            box-shadow: 0 1px 8px rgba(0, 0, 0, .04)
        }

        [data-theme="dark"] .mtable {
            box-shadow: none
        }

        .mrow {
            display: grid;
            grid-template-columns: 56px 38px 1fr auto;
            align-items: center;
            gap: 9px;
            padding: 11px 12px;
            border-bottom: 1px solid var(--bd);
            transition: background .15s;
        }

        @media(min-width:480px) {
            .mrow {
                grid-template-columns: 60px 42px 1fr auto;
                gap: 12px;
                padding: 13px 16px
            }
        }

        @media(min-width:768px) {
            .mrow {
                grid-template-columns: 64px 46px 1fr auto;
                gap: 16px;
                padding: 14px 20px
            }
        }

        .mrow:last-child {
            border-bottom: none
        }

        .mrow:hover {
            background: rgba(45, 111, 223, .025)
        }

        [data-theme="dark"] .mrow:hover {
            background: rgba(79, 142, 255, .025)
        }

        .midx {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--dm);
            text-align: center;
            font-variant-numeric: tabular-nums
        }

        .mav {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--ac), var(--ac2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: #fff;
            overflow: hidden;
            border: 2px solid var(--bd2);
            flex-shrink: 0
        }

        .mav img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .minfo {
            min-width: 0
        }

        .mname {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--tx);
            margin-bottom: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .memail {
            font-size: 11.5px;
            color: var(--mt);
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .memail i {
            font-size: 9px;
            color: var(--dm);
            flex-shrink: 0
        }

        .rp {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .3px;
            text-transform: uppercase;
            padding: 4px 9px;
            border-radius: 99px;
            white-space: nowrap
        }

        .rp-t {
            background: rgba(99, 64, 214, .1);
            color: var(--ac2);
            border: 1px solid rgba(99, 64, 214, .18)
        }

        .rp-s {
            background: rgba(45, 111, 223, .08);
            color: var(--ac);
            border: 1px solid rgba(45, 111, 223, .16)
        }

        [data-theme="dark"] .rp-t {
            background: rgba(124, 92, 252, .12);
            border-color: rgba(124, 92, 252, .2)
        }

        [data-theme="dark"] .rp-s {
            background: rgba(79, 142, 255, .1);
            border-color: rgba(79, 142, 255, .17)
        }

        /* EMPTY / LOADING */
        .empty {
            text-align: center;
            padding: 44px 20px;
            color: var(--mt)
        }

        .empty i {
            font-size: 26px;
            opacity: .2;
            display: block;
            margin-bottom: 10px
        }

        .empty h4 {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--tx);
            opacity: .4;
            margin-bottom: 5px
        }

        .empty p {
            font-size: 13px
        }

        .ld {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 72px 0;
            flex-direction: column;
            gap: 12px
        }

        .sp {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid var(--bd2);
            border-top-color: var(--ac);
            animation: rot .7s linear infinite
        }

        @keyframes rot {
            to {
                transform: rotate(360deg)
            }
        }

        .ld p {
            font-size: 13px;
            color: var(--mt);
            font-weight: 500
        }

        @keyframes sk {
            from {
                background-position: 200% 0
            }

            to {
                background-position: -200% 0
            }
        }

        .sk-row {
            height: 110px;
            border-radius: var(--r);
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--bg2) 0%, var(--bg3) 50%, var(--bg2) 100%);
            background-size: 200% 100%;
            animation: sk 1.5s linear infinite;
        }

        /* â─â─ MATERIALS â— GOOGLE CLASSROOM STYLE â─â─ */

        /* Toolbar */
        .mat-toolbar {
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-bottom: 14px
        }

        @media(min-width:640px) {
            .mat-toolbar {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center
            }
        }

        .mat-search {
            position: relative;
            width: 100%
        }

        @media(min-width:640px) {
            .mat-search {
                flex: 1;
                min-width: 160px;
                max-width: 250px
            }
        }

        .mat-search input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 10px;
            border: 1.5px solid var(--bd2);
            background: var(--bg2);
            color: var(--tx);
            font-family: var(--f);
            font-size: 14px;
            outline: none;
            transition: border-color .2s;
            -webkit-appearance: none;
            height: 44px;
        }

        [data-theme="light"] .mat-search input {
            background: #fff;
            border-color: rgba(0, 0, 0, .12)
        }

        .mat-search input::placeholder {
            color: var(--dm)
        }

        .mat-search input:focus {
            border-color: var(--ac)
        }

        .mat-search i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--dm);
            font-size: 13px;
            pointer-events: none
        }

        .mat-filters {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 2px;
            flex-shrink: 0
        }

        .mat-filters::-webkit-scrollbar {
            display: none
        }

        .mf-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            border-radius: 8px;
            font-family: var(--f);
            font-size: 12px;
            font-weight: 700;
            border: 1.5px solid var(--bd2);
            background: var(--bg2);
            color: var(--mt);
            cursor: pointer;
            transition: all .15s;
            white-space: nowrap;
            touch-action: manipulation;
            min-height: 38px;
            flex-shrink: 0;
        }

        [data-theme="light"] .mf-chip {
            background: #fff;
            border-color: rgba(0, 0, 0, .11)
        }

        .mf-chip:hover,
        .mf-chip:active {
            color: var(--ac);
            border-color: rgba(45, 111, 223, .3);
            background: rgba(45, 111, 223, .06)
        }

        [data-theme="dark"] .mf-chip:hover {
            background: rgba(79, 142, 255, .07);
            border-color: rgba(79, 142, 255, .3)
        }

        .mf-chip.active {
            background: rgba(45, 111, 223, .1);
            color: var(--ac);
            border-color: rgba(45, 111, 223, .28)
        }

        [data-theme="dark"] .mf-chip.active {
            background: rgba(79, 142, 255, .12);
            border-color: rgba(79, 142, 255, .3)
        }

        .mf-chip i {
            font-size: 10.5px
        }

        .mat-sort {
            display: flex;
            align-items: center;
            gap: 7px;
            width: 100%
        }

        @media(min-width:640px) {
            .mat-sort {
                width: auto;
                margin-left: auto;
                flex-shrink: 0
            }
        }

        .mat-sort>i {
            font-size: 11px;
            color: var(--mt);
            flex-shrink: 0
        }

        .mat-sort select {
            flex: 1;
            border: 1.5px solid var(--bd2);
            background: var(--bg2);
            color: var(--tx);
            font-family: var(--f);
            font-size: 13px;
            font-weight: 600;
            padding: 10px 12px;
            border-radius: 9px;
            outline: none;
            cursor: pointer;
            transition: border-color .2s;
            -webkit-appearance: none;
            height: 44px;
        }

        @media(min-width:640px) {
            .mat-sort select {
                flex: none;
                width: auto
            }
        }

        [data-theme="light"] .mat-sort select {
            background: #fff;
            border-color: rgba(0, 0, 0, .12)
        }

        .mat-sort select:focus {
            border-color: var(--ac)
        }

        .mat-count {
            font-size: 12px;
            font-weight: 600;
            color: var(--mt);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 5px
        }

        .mat-count strong {
            color: var(--tx)
        }

        /* Bulk delete bar */
        .bulk-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: var(--ac);
            color: #fff;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 14px;
            box-shadow: 0 4px 12px rgba(45, 111, 223, .3);
            animation: pi .26s ease;
        }

        .bulk-bar.active {
            display: flex;
        }

        .bulk-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 700;
        }

        .bulk-actions {
            display: flex;
            gap: 8px;
        }

        .bulk-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-family: var(--f);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all .15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bulk-btn.cancel {
            background: rgba(255, 255, 255, .2);
            color: #fff;
        }

        .bulk-btn.cancel:hover {
            background: rgba(255, 255, 255, .3);
        }

        .bulk-btn.delete {
            background: var(--rd);
            color: #fff;
        }

        .bulk-btn.delete:hover {
            background: #c5221f;
        }

        /* Date separator */
        .mat-date-sep {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0 10px;
        }

        .mat-date-sep:first-child {
            margin-top: 0
        }

        .mat-date-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .9px;
            text-transform: uppercase;
            color: var(--mt);
            white-space: nowrap;
        }

        .mat-date-label i {
            font-size: 9px;
            color: var(--dm)
        }

        .mat-date-line {
            flex: 1;
            height: 1px;
            background: var(--bd)
        }

        /* Post card */
        .mat-post {
            background: var(--bg2);
            border: 1.5px solid var(--bd);
            border-radius: 13px;
            overflow: hidden;
            margin-bottom: 10px;
            transition: border-color .2s, box-shadow .2s;
            animation: pi .26s ease both;
        }

        [data-theme="light"] .mat-post {
            background: #fff;
            border-color: rgba(0, 0, 0, .08);
            box-shadow: 0 1px 8px rgba(45, 111, 223, .07)
        }

        .mat-post:hover {
            border-color: rgba(45, 111, 223, .2);
            box-shadow: 0 5px 22px rgba(45, 111, 223, .11)
        }

        [data-theme="dark"] .mat-post:hover {
            border-color: rgba(79, 142, 255, .2);
            box-shadow: 0 5px 22px rgba(0, 0, 0, .35)
        }

        /* Post header */
        .mat-post-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 13px 10px;
            border-bottom: 1px solid var(--bd);
            background: var(--bg3);
        }

        @media(min-width:480px) {
            .mat-post-head {
                padding: 14px 16px 12px
            }
        }

        [data-theme="light"] .mat-post-head {
            background: #f8faff;
            border-bottom-color: rgba(0, 0, 0, .06)
        }

        .mat-post-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--ac), var(--ac2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: #fff;
            overflow: hidden;
            border: 2px solid rgba(45, 111, 223, .2);
        }

        .mat-post-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .mat-post-info {
            flex: 1;
            min-width: 0
        }

        .mat-post-name {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--tx);
            margin-bottom: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .mat-post-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--mt);
            flex-wrap: wrap
        }

        .mat-post-meta span {
            display: flex;
            align-items: center;
            gap: 3px
        }

        .mat-post-meta i {
            font-size: 8.5px
        }

        /* Post body */
        .mat-post-body {
            padding: 11px 13px 10px;
        }

        @media(min-width:480px) {
            .mat-post-body {
                padding: 13px 16px 12px
            }
        }

        .mat-post-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--tx);
            margin-bottom: 4px;
            line-height: 1.4
        }

        .mat-post-desc {
            font-size: 13px;
            color: var(--tx2);
            line-height: 1.65
        }

        /* Attachments section */
        .mat-attachments {
            padding: 0 13px 10px;
        }

        @media(min-width:480px) {
            .mat-attachments {
                padding: 0 16px 12px
            }
        }

        .mat-att-label {
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: .8px;
            text-transform: uppercase;
            color: var(--dm);
            margin-bottom: 7px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        [data-theme="light"] .mat-att-label {
            color: var(--mt)
        }

        .mat-att-label i {
            font-size: 8.5px
        }

        /* â˜… Attachment row â— smart mobile layout â˜… */
        .mat-att-row {
            background: var(--bg3);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 10px 11px;
            margin-bottom: 6px;
            display: grid;
            grid-template-areas: "check ico info" "check ico btns";
            grid-template-columns: auto 36px 1fr;
            grid-template-rows: auto auto;
            gap: 4px 10px;
            transition: border-color .15s, background .15s;
            align-items: start;
        }

        .mat-att-row:last-child {
            margin-bottom: 0
        }

        [data-theme="light"] .mat-att-row {
            background: #f3f6fd;
            border-color: rgba(0, 0, 0, .07)
        }

        .mat-att-row:hover {
            border-color: var(--bd2)
        }

        [data-theme="light"] .mat-att-row:hover {
            background: #eaf0fc;
            border-color: rgba(45, 111, 223, .18)
        }

        [data-theme="dark"] .mat-att-row:hover {
            background: var(--bg4)
        }

        /* On tablet+ â— one-row layout with buttons on right */
        @media(min-width:580px) {
            .mat-att-row {
                grid-template-areas: "check ico info btns";
                grid-template-columns: auto 36px 1fr auto;
                grid-template-rows: auto;
                align-items: center;
                gap: 0 10px;
                padding: 10px 12px;
            }
        }

        .mat-check {
            grid-area: check;
            align-self: center;
        }

        .mat-att-ico {
            grid-area: ico;
            width: 36px;
            height: 36px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            background: var(--bg2);
            flex-shrink: 0;
            align-self: start;
        }

        @media(min-width:580px) {
            .mat-att-ico {
                align-self: center
            }
        }

        [data-theme="light"] .mat-att-ico {
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .07)
        }

        .mat-att-info {
            grid-area: info;
            min-width: 0
        }

        .mat-att-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--tx);
            margin-bottom: 2px;
            word-break: break-word;
            line-height: 1.35
        }

        @media(min-width:580px) {
            .mat-att-name {
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis
            }
        }

        .mat-att-type {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .5px;
            text-transform: uppercase
        }

        /* Buttons row â— full width on mobile, auto on desktop */
        .mat-att-btns {
            grid-area: btns;
            display: flex;
            gap: 5px;
            flex-wrap: nowrap;
            width: 100%;
        }

        @media(min-width:580px) {
            .mat-att-btns {
                width: auto;
                flex-shrink: 0
            }
        }

        .mat-att-btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px 6px;
            border-radius: 8px;
            font-family: var(--f);
            font-size: 12px;
            font-weight: 700;
            border: 1px solid var(--bd2);
            background: var(--bg2);
            cursor: pointer;
            color: var(--mt);
            transition: all .15s;
            white-space: nowrap;
            text-decoration: none;
            min-height: 36px;
            touch-action: manipulation;
        }

        @media(min-width:580px) {
            .mat-att-btn {
                flex: none;
                padding: 7px 12px;
                font-size: 12px
            }
        }

        [data-theme="light"] .mat-att-btn {
            background: #fff;
            border-color: rgba(0, 0, 0, .1);
            color: #5a6a8e
        }

        .mat-att-btn i {
            font-size: 10.5px
        }

        .mat-att-btn:hover,
        .mat-att-btn:active {
            color: var(--ac);
            border-color: rgba(45, 111, 223, .32);
            background: rgba(45, 111, 223, .07)
        }

        [data-theme="dark"] .mat-att-btn:hover {
            border-color: rgba(79, 142, 255, .38);
            background: rgba(79, 142, 255, .08)
        }

        .mat-att-btn.dl:hover,
        .mat-att-btn.dl:active {
            color: var(--gr);
            border-color: rgba(0, 168, 122, .32);
            background: rgba(0, 168, 122, .07)
        }

        [data-theme="dark"] .mat-att-btn.dl:hover {
            border-color: rgba(0, 200, 150, .38);
            background: rgba(0, 200, 150, .08)
        }

        .mat-att-btn.del:hover,
        .mat-att-btn.del:active {
            color: var(--rd);
            border-color: rgba(217, 53, 69, .32);
            background: rgba(217, 53, 69, .07)
        }

        [data-theme="dark"] .mat-att-btn.del:hover {
            border-color: rgba(255, 71, 87, .38);
            background: rgba(255, 71, 87, .08)
        }

        /* Empty state */
        .mat-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 52px 20px;
            text-align: center;
            border: 2px dashed var(--bd2);
            border-radius: var(--r);
            color: var(--mt)
        }

        .mat-empty-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: var(--bg3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--dm);
            margin-bottom: 12px
        }

        .mat-empty h4 {
            font-size: 14.5px;
            font-weight: 800;
            color: var(--tx);
            margin-bottom: 6px;
            opacity: .5
        }

        .mat-empty p {
            font-size: 13px;
            line-height: 1.6;
            max-width: 240px
        }

        /* File viewer modal */
        .file-viewer-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, .9);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .file-viewer-modal.active {
            display: flex;
        }

        .file-viewer-content {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            background: var(--bg2);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .file-viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--bd);
            background: var(--bg3);
        }

        .file-viewer-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--tx);
        }

        .file-viewer-close {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--bd2);

    <!-- File Viewer Modal -->

    <div class="toast" id="toast"></div>

    <script>
        function setT(m) { localStorage.setItem('qt', m); applyT() }
        function applyT() {
            const m = localStorage.getItem('qt') || 'light';
            const dk = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme:dark)').matches);
            document.documentElement.setAttribute('data-theme', dk ? 'dark' : 'light');
            const map = { system: 'System', light: 'Light', dark: 'Dark' };
            document.querySelectorAll('.tb').forEach(b => b.classList.toggle('on', b.title === map[m]));
        }
        applyT();
        matchMedia('(prefers-color-scheme:dark)').addEventListener('change', applyT);

        const TK = localStorage.getItem('jwt_token');
        const CID = new URLSearchParams(location.search).get('id');
        if (CID) localStorage.setItem('cg_last_classroom', CID);
        const USR = JSON.parse(localStorage.getItem('user') || '{}');
        let TEACH = ['teacher', 'faculty', 'admin', 'org_admin', 'super_admin'].includes(USR.role);
        function api(u, o = {}) { return fetch(u, { ...o, headers: { 'Authorization': `Bearer ${TK}`, ...(o.headers || {}) }, credentials: 'include' }) }
        let TEACHER = {};
        let SELECTED_FILES = new Set();

        window.swTab = function (n, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
            const panel = g('p-' + n);
            if (panel) panel.classList.add('on');
            if (btn) btn.classList.add('on');
            if (n === 'act') loadActivityLog();
            if (n === 'att') loadAttendanceTab();

        };

        window.goTab = function (n) {
            const tab = document.querySelector('.tab[onclick*="swTab(\'' + n + '\'"]');
            if (tab) { swTab(n, tab); }
            else { const first = document.querySelector('.tab:not([style*="display:none"])'); if (first) first.click(); }
        };

        function sk() { return '<div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div>'; }
        function sn(id, v) { const e = g(id); if (e) e.textContent = v; }
        function dt(d) { try { return new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) } catch (e) { return d } }
        function dtFull(d) { try { return new Date(d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) } catch (e) { return d } }
        function dateKey(d) { try { const dd = new Date(d); return dd.getFullYear() + '-' + dd.getMonth() + '-' + dd.getDate() } catch (e) { return 'x' } }

        async function generateDeviceFingerprint() {
            try {
                const components = [
                    navigator.userAgent,
                    screen.width,
                    screen.height,
                    Intl.DateTimeFormat().resolvedOptions().timeZone,
                    navigator.language,
                    navigator.hardwareConcurrency || 'unknown'
                ];
                const rawString = components.join('|');
                const buffer = new TextEncoder().encode(rawString);
                const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            } catch (e) {
                console.warn("Fingerprint generation failed. Falling back to simple string.");
                return btoa(navigator.userAgent).substring(0, 32);
            }
        }

        async function loadAll() {
            if (!g('p-ann')) return;
            ['ann', 'mat', 'qz'].forEach(k => { const el = g('p-' + k); if (el) el.innerHTML = sk(); });
            try {
                const [mR, aR, qR, sR, orgAnnR] = await Promise.all([
                    api('/api/classrooms/' + CID + '/content/materials'),
                    api('/api/classrooms/' + CID + '/content/announcements'),
                    api('/api/classrooms/' + CID + '/content/quizzes'),
                    api('/api/classrooms/' + CID + '/students'),
                    api('/api/org/announcements').catch(() => null)
                ]);
                const mats = (await mR.json()).content || [];
                const classAnns = (await aR.json()).content || [];
                const qzs = (await qR.json()).content || [];
                let sd = { students: [], total: 0 };
                try { sd = await sR.json(); } catch (e) { }

                // Merge org announcements into the announcements tab
                let orgAnns = [];
                try {
                    if (orgAnnR && orgAnnR.ok) {
                        const orgData = await orgAnnR.json();
                        orgAnns = (orgData.announcements || []).map(a => ({
                            ...a,
                            id: a._id || a.id,
                            title: a.title || '',
                            content: a.content || '',
                            message: a.content || '',
                            created_at: a.createdAt || a.created_at || a.sent_at,
                            posted_by: (a.created_by?.name || a.creator_name || 'Org Admin'),
                            _isOrgAnn: true
                        }));
                    }
                } catch (e) { /* org announcements fetch failed - non-critical */ }

                const allAnns = [...classAnns, ...orgAnns].sort((a, b) =>
                    new Date(b.created_at || 0) - new Date(a.created_at || 0)
                );

                sn('n-ann', allAnns.length); sn('n-mat', mats.length); sn('n-qz', qzs.length);
                sn('n-mem', sd.total || (sd.students || []).length);
                rAnns(allAnns); rMats(mats); rQzs(qzs); rMems(sd.students || [], sd.total || 0);
                loadAttendanceTab();

            } catch (e) { console.error(e); }
        }

        function rAnns(list) {
            const el = g('p-ann');
            if (!el) return;
            el.innerHTML = list.length ? list.map(a => {
                const T = a.title || '', C = a.content || a.message || '';
                const show = T && T !== C;
                const j = JSON.stringify(a).replace(/"/g, '&quot;');
                const isOrg = a._isOrgAnn;
                const ops = (!isOrg && TEACH) ? '<div class="cops"><button class="cop" onclick="event.stopPropagation();openEdit(\'announcements\',\'' + (a.id || a._id) + '\',' + j + ')"><i class="fas fa-pen"></i></button><button class="cop del" onclick="event.stopPropagation();openDel(\'announcements\',\'' + (a.id || a._id) + '\',\'' + x(T || C) + '\')"><i class="fas fa-trash"></i></button></div>' : '';
                const orgBadge = isOrg ? '<span style="display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;margin-left:6px;vertical-align:middle"><i class="fas fa-building"></i>Organization Admin</span>' : '';

                let attHTML = '';
                if (a.attachment_url) {
                    const attName = a.attachment_name || 'Attached Document';
                    attHTML = '<div style="margin-top:12px;padding:10px 12px;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;display:flex;align-items:center;gap:10px;">' +
                        '<div style="font-size:18px;color:var(--rd);display:flex;align-items:center;justify-content:center"><i class="fas fa-file-pdf"></i></div>' +
                        '<div style="flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)">' + x(attName) + '</div>' +
                        '<button onclick="event.stopPropagation();viewFile(\'' + a.attachment_url + '\',\'' + x(attName) + '\',\'ann_' + (a.id || a._id) + '\')" style="background:var(--ac);color:#fff;border:none;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:0.2s"><i class="fas fa-eye"></i> View</button>' +
                        '</div>';
                }

                // Tag rendering
                const tagColors = { Urgent: '#ff4757', Exam: '#ffa502', Event: '#2ed573', General: '#57606f' };
                let tagsHTML = '';
                const rawTags = a.tags || [];
                const tagArr = Array.isArray(rawTags) ? rawTags : [rawTags];
                tagArr.filter(Boolean).forEach(t => {
                    const tc = tagColors[t] || tagColors.General;
                    tagsHTML += '<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;background:' + tc + '18;color:' + tc + ';border:1px solid ' + tc + '30"><i class="fas fa-tag" style="font-size:8px"></i>' + x(t) + '</span>';
                });

                return '<div class="card"><div class="card-ico ' + (isOrg ? 'ci-p' : 'ci-p') + '"><i class="fas fa-bullhorn"></i></div><div class="cbody">' +
                    (show ? '<div class="ctit">' + x(T) + orgBadge + '</div>' : '') +
                    '<div class="' + (show ? 'cdesc' : 'ctit') + '">' + x(C) + (!show ? orgBadge : '') + '</div>' +
                    attHTML +
                    '<div class="cfoot"><span class="cdate"><i class="fas fa-clock"></i>' + dt(a.created_at) + '</span>' +
                    (a.posted_by ? '<span class="cdate"><i class="fas fa-user"></i>' + x(a.posted_by) + '</span>' : '') +
                    (tagsHTML ? '<span style="display:inline-flex;gap:4px">' + tagsHTML + '</span>' : '') +
                    '</div></div>' + ops + '</div>';
            }).join('') : empty('fa-bullhorn', 'No Announcements', 'Nothing posted yet.');
        }

        async function loadActivityLog() {

                el.innerHTML = '<div style="text-align:center;padding:40px 20px"><i class="fas fa-lock" style="font-size:36px;color:var(--mt);opacity:.5;margin-bottom:10px;display:block"></i><h4 style="color:var(--tx);margin-bottom:4px">Faculty Only</h4><p style="color:var(--mt);font-size:13px">This section is only visible to instructors.</p></div>';
                return;
            }
            el.innerHTML = '<div style="text-align:center;padding:30px;color:var(--mt)"><i class="fas fa-spinner fa-spin" style="font-size:20px"></i><p style="margin-top:10px">Loading activity...</p></div>';
            try {
                const r = await api('/api/activity/classroom/' + CID);

<div style="padding:16px">

                    const ts = new Date(l.timestamp).toLocaleString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    return `<div style="display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;background:var(--bg3);border:1px solid var(--bd)">

          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;color:var(--tx)">${esc(u.name || 'Unknown')}</div>
            <div style="font-size:11px;color:var(--mt);margin-top:1px"><i class="fas ${actionIcon(l.action)}" style="margin-right:4px;color:var(--ac)"></i>${actionLabel(l.action)}${l.targetTitle ? ': <em>' + esc(l.targetTitle) + '</em>' : ''}</div>

        </div>`;
                }).join('')}
  </div>
</div>`;
            } catch (e) {
                el.innerHTML = '<div style="text-align:center;padding:30px;color:var(--rd);font-size:13px"><i class="fas fa-exclamation-triangle"></i> Failed to load activity log.</div>';

        async function init() {

            if (!TK) { location.href = '/login.html'; return; }
            if (!CID || CID === 'undefined') { location.href = '/my-classrooms'; return; }

            // ── FAST-BOOT: Render cached classroom header instantly ──
            const cacheKey = 'vc_cache_' + CID;
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
                try {
                    const c = JSON.parse(cached);
                    document.title = (c.name || 'Classroom') + ' | Classgrid';
                    const hT = g('hTitle'); if (hT) hT.textContent = c.name || '';
                    const hD = g('hDesc'); if (hD) hD.textContent = c.description || 'Welcome to this classroom.';
                    const tT = g('tTag'); if (tT) tT.textContent = c.subject || c.subjectSlug || 'Classroom';
                    if (c.teacherName) { const tN = g('tName'); if (tN) tN.textContent = c.teacherName; }
                    if (c.teacherPic) { const tA = g('tAv'); if (tA) tA.innerHTML = '<img src="' + c.teacherPic + '" onerror="this.parentElement.textContent=\'' + (c.teacherName || 'I').charAt(0).toUpperCase() + '\'">'; }
                    // Show the app shell immediately with cached data
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                    // Show default tab
                    const activeTab = new URLSearchParams(window.location.search).get('tab') || 'ann';
                    window.goTab(activeTab);
                } catch (e) { console.warn('Fast-boot cache parse failed', e); }
            }

            const ctrl = window.initCtrl = new AbortController();
            const tid = setTimeout(() => ctrl.abort(), 15000);

            try {
                // Fetch auth and classroom data in parallel
                const [authRes, classRes] = await Promise.all([
                    fetch('/api/auth/me', { signal: ctrl.signal, headers: { 'Authorization': `Bearer ${TK}` }, credentials: 'include' }),
                    fetch('/api/classrooms/' + CID, { signal: ctrl.signal, headers: { 'Authorization': `Bearer ${TK}` }, credentials: 'include' })
                ]);
                clearTimeout(tid);

                if (!authRes.ok) { localStorage.removeItem('jwt_token'); location.href = '/login.html'; return; }
                const authData = await authRes.json();
                USER = authData.user || authData;
                if (USER.organization && !USER.organization_id) USER.organization_id = USER.organization;
                localStorage.setItem('user', JSON.stringify(USER));

                if (!classRes.ok) throw new Error('Classroom not found or access denied.');
                const classData = await classRes.json();
                // API returns { classroom: {...}, isOwner: bool }
                ROOM = classData.classroom || classData;
                const isOwner = classData.isOwner || false;
                TEACHER = (ROOM.teacher && typeof ROOM.teacher === 'object') ? ROOM.teacher : {};

                // ── Cache classroom metadata for fast-boot next time ──
                try {
                    localStorage.setItem(cacheKey, JSON.stringify({
                        name: ROOM.name, description: ROOM.description,
                        subject: ROOM.subject, subjectSlug: ROOM.subjectSlug,
                        teacherName: TEACHER.name || '',
                        teacherPic: TEACHER.profilePicture || '',
                        _ts: Date.now()
                    }));
                } catch (e) { /* localStorage full — non-critical */ }

                // Populate classroom meta
                document.title = (ROOM.name || 'Classroom') + ' | Classgrid';
                document.getElementById('hTitle').textContent = ROOM.name || '';
                document.getElementById('hDesc').textContent = ROOM.description || 'Welcome to this classroom.';
                document.getElementById('tTag').textContent = ROOM.subject || ROOM.subjectSlug || 'Classroom';

                const bs = document.getElementById('hStat');
                if (bs) {
                    bs.innerHTML = '';
                    if (ROOM.subject) bs.innerHTML += '<i class="fas fa-book" style="color:var(--ac)"></i> ' + esc(ROOM.subject);
                    if (ROOM.subject && ROOM.subjectSlug) bs.innerHTML += ' &nbsp;&middot;&nbsp; ';
                    if (ROOM.subjectSlug) bs.innerHTML += '<i class="fas fa-tag" style="color:var(--ac2)"></i> ' + esc(ROOM.subjectSlug);
                }

                const teacher = (ROOM.teacher && typeof ROOM.teacher === 'object') ? ROOM.teacher : null;
                if (teacher) {
                    document.getElementById('tName').textContent = teacher.name || 'Instructor';
                    document.getElementById('tBio').textContent = teacher.bio || teacher.qualification || teacher.department || '';
                    const tav = document.getElementById('tAv');
                    if (teacher.profilePicture) {
                        tav.innerHTML = '<img src="' + esc(teacher.profilePicture) + '" onerror="this.parentElement.textContent=\'' + (teacher.name || 'I').charAt(0).toUpperCase() + '\'">';
                    } else {
                        tav.textContent = (teacher.name || 'I').charAt(0).toUpperCase();
                    }
                } else {
                    document.getElementById('tName').textContent = 'Instructor';
                    document.getElementById('tBio').textContent = '';
                    document.getElementById('tAv').textContent = 'I';
                }

                // Set nav links
                const roomId = ROOM._id || ROOM.id || CID;
                document.getElementById('chatLink').href = '/classroom-chat.html?id=' + roomId;
                const isTeacher = isOwner || USER._id === ROOM.createdBy || (ROOM.teacher && USER._id === ROOM.teacher._id);
                const backEl = document.getElementById('backLink');
                backEl.dataset.dest = isTeacher ? '/manage-classroom' : '/my-classrooms';

                // Show tabs
                document.getElementById('tabAnn').style.display = '';
                document.getElementById('tabMat').style.display = '';
                document.getElementById('tabQz').style.display = '';
                if (isTeacher) {
                    document.getElementById('tab-att').style.display = '';
                    document.getElementById('tabAct').style.display = '';
                }

                document.getElementById('tabMbr').style.display = '';

                // Show the app
                document.getElementById('loader').style.display = 'none';
                document.getElementById('app').style.display = 'flex';

                // Go to requested tab or default
                const activeTab = new URLSearchParams(window.location.search).get('tab') || 'ann';
                window.goTab(activeTab);

                // Load all tab content
                await loadAll();

            } catch (err) {
                console.error('Init error:', err);
                if (err.name === 'AbortError') toast('Connection timeout. Please refresh.', 'error');
                else {
                    document.getElementById('loader').innerHTML = "<div style='text-align:center;padding:2rem'><i class='fas fa-door-closed' style='font-size:3rem;color:var(--mt);margin-bottom:1rem;display:block'></i><h2 style='color:var(--tx);margin-bottom:0.5rem'>Classroom Unavailable</h2><p style='color:var(--mt);margin-bottom:1.5rem'>You do not have access, or it has been removed.</p><a href='/my-classrooms' class='btn btn-primary' style='display:inline-flex'><i class='fas fa-arrow-left'></i>&nbsp;Go Back</a></div>";
                }
            }
        }

        const rD = d => { try { return new Date(d).toLocaleString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) } catch { return 'Unknown' } };
        const esc = s => s ? String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : '';
        function typeInfo(raw) {
            const t = (raw || '').toLowerCase().trim();
            if (t === 'pdf') return { icon: 'fa-file-pdf', color: '#e74c3c', label: 'PDF', group: 'pdf' };
            if (['ppt', 'pptx'].includes(t)) return { icon: 'fa-file-powerpoint', color: '#e67e22', label: 'PPT', group: 'ppt' };
            if (['doc', 'docx'].includes(t)) return { icon: 'fa-file-word', color: '#2980b9', label: 'DOC', group: 'doc' };
            if (['xls', 'xlsx', 'csv'].includes(t)) return { icon: 'fa-file-excel', color: '#27ae60', label: 'XLS', group: 'xls' };
            if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(t)) return { icon: 'fa-file-image', color: '#8e44ad', label: 'IMG', group: 'img' };
            if (t === 'txt') return { icon: 'fa-file-lines', color: '#7f8c8d', label: 'TXT', group: 'other' };
            return { icon: 'fa-file-alt', color: '#5e6e94', label: t.toUpperCase() || 'FILE', group: 'other' };
        }

        function gvUrl(m) {
            const t = (m.type || '').toLowerCase();
            return ['pdf', 'ppt', 'pptx', 'doc', 'docx', 'xls', 'xlsx'].includes(t)
                ? 'https://docs.google.com/gview?url=' + encodeURIComponent(m.file_url) + '&embedded=true' : m.file_url;
        }

        function groupMats(list) {
            const map = new Map();
            list.forEach(m => {
                const k = m.post_id || m.batch_id || (dateKey(m.created_at) + '::' + (m.uploaded_by || ''));
                if (!map.has(k)) map.set(k, { k, title: m.post_title || m.batch_title || '', description: m.post_description || m.description || '', uploaded_by: m.uploaded_by || '', created_at: m.created_at, files: [] });
                map.get(k).files.push(m);
            });
            return [...map.values()];
        }

        function attRowHTML(m) {
            const ti = typeInfo(m.type);
            const vu = gvUrl(m);
            const j = JSON.stringify(m).replace(/"/g, '&quot;');
            const eBtn = TEACH ? `<button class="mat-att-btn" onclick="event.stopPropagation();openEdit('materials','${m.id}',${j})"><i class="fas fa-pen"></i> Rename</button>` : '';
            const dBtn = TEACH ? `<button class="mat-att-btn del" onclick="event.stopPropagation();openDel('materials','${m.id}','${x(m.title)}')"><i class="fas fa-trash"></i> Delete</button>` : '';
            const checkBox = TEACH ? `<input type="checkbox" class="mat-check" data-id="${m.id}" data-title="${x(m.title)}" onclick="event.stopPropagation();toggleSelect(this)" style="width:20px;height:20px;cursor:pointer;">` : '';
            const smzBtn = ti.group === 'pdf' ? `<button class="mat-att-btn smz" onclick="event.stopPropagation();summarizePdf('${m.id}','${x(m.title)}','${m.file_url}')" style="color:#8e44ad;border-color:rgba(142,68,173,0.3);"><i class="fas fa-magic"></i> Summarize</button>` : '';
            return `<div class="mat-att-row" data-file-id="${m.id}">
  ${checkBox}
  <div class="mat-att-ico" style="color:${ti.color}"><i class="fas ${ti.icon}"></i></div>
  <div class="mat-att-info">
    <div class="mat-att-name" title="${x(m.title)}">${x(m.title)}</div>
    <div class="mat-att-type" style="color:${ti.color}">${ti.label}</div>
  </div>
  <div class="mat-att-btns">
    <button class="mat-att-btn" onclick="event.stopPropagation();viewFile('${vu}','${x(m.title)}','${m.id}')"><i class="fas fa-eye"></i> View</button>
    <button class="mat-att-btn dl" onclick="event.stopPropagation();downloadFile('${m.file_url}','${x(m.title)}')"><i class="fas fa-download"></i> Save</button>
    ${smzBtn}${eBtn}${dBtn}
  </div>
</div>`;
        }

        function postHTML(grp, tInfo) {
            const ini = (grp.uploaded_by || (tInfo && tInfo.name) || 'T').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
            const av = (tInfo && tInfo.profilePicture) ? `<img src="${x(tInfo.profilePicture)}" alt="${x(tInfo.name)}" onerror="this.parentElement.innerHTML='${ini}'">` : ini;
            const title = grp.title || (grp.files.length === 1 ? grp.files[0].title : '');
            const desc = grp.description;
            const body = (title || desc) ? `<div class="mat-post-body">
    ${title ? `<div class="mat-post-title">${x(title)}</div>` : ''}
    ${desc ? `<div class="mat-post-desc">${x(desc)}</div>` : ''}
  </div>` : '';
            const attLbl = grp.files.length > 1 ? `<div class="mat-att-label"><i class="fas fa-paperclip"></i>${grp.files.length} attachments</div>` : '';
            return `<div class="mat-post">
  <div class="mat-post-head">
    <div class="mat-post-avatar">${av}</div>
    <div class="mat-post-info">
      <div class="mat-post-name">${x(grp.uploaded_by || (tInfo && tInfo.name) || 'Instructor')}</div>
      <div class="mat-post-meta">
        <span><i class="fas fa-calendar-alt"></i>${dtFull(grp.created_at)}</span>
        <span><i class="fas fa-file"></i>${grp.files.length} file${grp.files.length !== 1 ? 's' : ''}</span>
      </div>
    </div>
  </div>
  ${body}
  <div class="mat-attachments">${attLbl}${grp.files.map(attRowHTML).join('')}</div>
</div>`;
        }

        function renderMats() {
            const el = g('p-mat');
            if (!el) return;
            if (!MAT_ALL.length) {
                el.innerHTML = `<div class="mat-empty"><div class="mat-empty-icon"><i class="fas fa-folder-open"></i></div><h4>No Materials Yet</h4><p>Files uploaded by your instructor will appear here.</p></div>`; return;
            }
            let filt = MAT_ALL.filter(m => {
                const ti = typeInfo(m.type);
                return (MAT_FILTER === 'all' || ti.group === MAT_FILTER) && (!MAT_SEARCH || m.title.toLowerCase().includes(MAT_SEARCH.toLowerCase()));
            });
            if (MAT_SORT === 'newest') filt.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            else if (MAT_SORT === 'oldest') filt.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            else if (MAT_SORT === 'name_az') filt.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
            else if (MAT_SORT === 'name_za') filt.sort((a, b) => (b.title || '').localeCompare(a.title || ''));
            const cnts = {};
            MAT_ALL.forEach(m => { const g2 = typeInfo(m.type).group; cnts[g2] = (cnts[g2] || 0) + 1; });
            const chips = [
                { key: 'all', icon: 'fa-layer-group', label: 'All' },
                { key: 'pdf', icon: 'fa-file-pdf', label: 'PDF' },
                { key: 'ppt', icon: 'fa-file-powerpoint', label: 'PPT' },
                { key: 'doc', icon: 'fa-file-word', label: 'Doc' },
                { key: 'img', icon: 'fa-file-image', label: 'Image' },
                { key: 'xls', icon: 'fa-file-excel', label: 'Sheet' },
                { key: 'other', icon: 'fa-file-alt', label: 'Other' },
            ].filter(c => c.key === 'all' || cnts[c.key])
                .map(c => {
                    const n = c.key === 'all' ? MAT_ALL.length : (cnts[c.key] || 0);
                    return `<button class="mf-chip ${MAT_FILTER === c.key ? 'active' : ''}" onclick="setMatFilter('${c.key}')"><i class="fas ${c.icon}"></i>${c.label} <span style="opacity:.55">${n}</span></button>`;
                }).join('');
            const groups = groupMats(filt);
            if (MAT_SORT === 'newest' || MAT_SORT === 'oldest')
                groups.sort((a, b) => MAT_SORT === 'newest' ? new Date(b.created_at) - new Date(a.created_at) : new Date(a.created_at) - new Date(b.created_at));
            let html = ''; let ldk = null;
            groups.forEach(grp => {
                const dk = dateKey(grp.created_at);
                if ((MAT_SORT === 'newest' || MAT_SORT === 'oldest') && dk !== ldk) {
                    html += `<div class="mat-date-sep"><span class="mat-date-label"><i class="fas fa-calendar-days"></i>${dtFull(grp.created_at)}</span><div class="mat-date-line"></div></div>`;
                    ldk = dk;
                }
                html += postHTML(grp, TEACHER);
            });
            const bulkBar = TEACH ? `<div class="bulk-bar" id="bulkBar"><div class="bulk-info"><i class="fas fa-check-circle"></i><span id="bulkCount">0 selected</span></div><div class="bulk-actions"><button class="bulk-btn cancel" onclick="clearSelection()">Cancel</button><button class="bulk-btn delete" onclick="bulkDelete()"><i class="fas fa-trash"></i> Delete Selected</button></div></div>` : '';
            el.innerHTML = `${bulkBar}<div class="mat-toolbar">
  <div class="mat-search"><i class="fas fa-search"></i><input type="text" placeholder="Search materials…" value="${x(MAT_SEARCH)}" oninput="setMatSearch(this.value)" autocomplete="off"></div>
  <div class="mat-filters">${chips}</div>
  <div class="mat-sort"><i class="fas fa-sort"></i>
    <select onchange="setMatSort(this.value)" aria-label="Sort">
      <option value="newest" ${MAT_SORT === 'newest' ? 'selected' : ''}>Newest First</option>
      <option value="oldest" ${MAT_SORT === 'oldest' ? 'selected' : ''}>Oldest First</option>
      <option value="name_az" ${MAT_SORT === 'name_az' ? 'selected' : ''}>Name A ? Z</option>
      <option value="name_za" ${MAT_SORT === 'name_za' ? 'selected' : ''}>Name Z ? A</option>
    </select>
  </div>
</div>
<div class="mat-count">Showing <strong>${filt.length}</strong> of ${MAT_ALL.length} file${MAT_ALL.length !== 1 ? 's' : ''}</div>
${groups.length ? html : `<div class="mat-empty" style="padding:44px 20px"><div class="mat-empty-icon"><i class="fas fa-search"></i></div><h4>No Results</h4><p>Try a different search or filter.</p></div>`}`;
        }

        window.toggleSelect = function (checkbox) {
            const id = checkbox.dataset.id;
            if (checkbox.checked) { SELECTED_FILES.add(id); } else { SELECTED_FILES.delete(id); }
            updateBulkBar();
        };

        function updateBulkBar() {
            if (!TEACH) return;
            const bar = g('bulkBar'); const count = g('bulkCount');

            // Call backend proxy — avoids CORS (HF blocks direct browser requests)
            const res = await fetch('/api/classrooms/hf-summarize', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${TK}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text })
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || `Summarization failed (HTTP ${res.status})`);
            }

            const data = await res.json();
