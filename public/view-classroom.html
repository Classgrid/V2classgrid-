        window.summarizePdf = async function (id, title, url) {
            const modal = g('smzModal');
            const body = g('smzBody');
            const titleEl = g('smzTitle').querySelector('span');

            titleEl.textContent = "Summary: " + title;
            body.innerHTML = '<div style="text-align:center;padding:20px;"><i class="fas fa-spinner fa-spin" style="font-size:24px;color:var(--ac);margin-bottom:10px;"></i><div id="smzStatus">Extracting text from PDF...</div></div>';
            modal.classList.add('open');

            try {
                // 1. Fetch and Parse PDF through our backend proxy to bypass Supabase CORS
                const proxyUrl = `/api/classrooms/proxy/pdf?url=${encodeURIComponent(url)}`;
                const pdfRes = await fetch(proxyUrl, { headers: { 'Authorization': 'Bearer ' + (TK), 'Content-Type': 'application/json' } });

                if (!pdfRes.ok) {
                    throw new Error(`Failed to download PDF (HTTP ${pdfRes.status}). The file might be private or unavailable.`);
                }

                const contentType = pdfRes.headers.get('content-type');
                if (contentType && !contentType.includes('application/pdf')) {
                    throw new Error("The downloaded file is not a valid PDF. It might be blocked or corrupted.");
                }

                const pdfData = await pdfRes.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;

                let extractedText = '';
                const maxPagesToProcess = Math.min(4, pdf.numPages);
                for (let i = 1; i <= maxPagesToProcess; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    extractedText += textContent.items.map(item => item.str).join(' ') + ' ';
                }

                extractedText = extractedText.trim();
                if (!extractedText) throw new Error("Could not extract any text from this PDF. It may be an image-only document.");

                let pageLimitNotice = '';
                if (pdf.numPages > 4) {
                    pageLimitNotice = `\n\n**Note: To ensure fast processing, this summary only covers the first 4 pages of the ${pdf.numPages}-page document.**`;
                }

                // 2. Send the extracted text directly to our backend proxy
                // (The backend proxy now handles chunking and sequential HF/Groq calls)
                document.getElementById('smzStatus').textContent = `Summarizing document with AI... this may take up to 30 seconds.`;

                let finalSummary = await summarizeWithHF(extractedText);

                // Add notice if we didn't summarize the whole document
                finalSummary += pageLimitNotice;

                // Format markdown-like response for simple HTML viewing
                const formattedSummary = finalSummary
                    .replace(/</g, '&lt;').replace(/>/g, '&gt;') // Prevent XSS
                    .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')       // Bold format
                    .replace(/\*(.*?)\*/g, '<i>$1</i>')           // Italic format
                    .replace(/\n/g, '<br>');                      // Newlines

                // 3. Update UI (and optionally cache in background)
                body.innerHTML = formattedSummary;

                // Cache it silently in background (don't block UI)
                api(`/api/classrooms/${CID}/content/materials/${id}/summarize`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cachedSummary: finalSummary })
                }).catch(e => console.warn('Failed to cache summary', e));

            } catch (e) {
                const safeMsg = e.message ? e.message.replace(/</g, '&lt;').replace(/>/g, '&gt;') : "Unknown error";
                body.innerHTML = `<div style="color:var(--rd);display:flex;align-items:center;gap:8px;"><i class="fas fa-exclamation-circle"></i> Error: ${safeMsg}</div>`;
            }
        };

        // Helper: Calculate distance between two coordinates in meters
        function haversineDist(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Earth radius in meters
            const p1 = lat1 * Math.PI / 180;
            const p2 = lat2 * Math.PI / 180;
            const dp = (lat2 - lat1) * Math.PI / 180;
            const dl = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dp / 2) * Math.sin(dp / 2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // Helper: Generate GeoJSON polygon for radius circle
        function createCircleGeoJSON(center, radiusInMeters) {
            const points = 64;
            const coords = { latitude: center[1], longitude: center[0] };
            const km = radiusInMeters / 1000;
            const ret = [];
            const distanceX = km / (111.320 * Math.cos(coords.latitude * Math.PI / 180));
            const distanceY = km / 110.574;
            for(let i=0; i<points; i++) {
                const theta = (i / points) * (2 * Math.PI);
                ret.push([coords.longitude + distanceX * Math.cos(theta), coords.latitude + distanceY * Math.sin(theta)]);
            }
            ret.push(ret[0]); // close polygon
            return { type: "Feature", geometry: { type: "Polygon", coordinates: [ret] } };
        }

                if (d && d.display_name) {
                    // Make it shorter: e.g. "PCCOE, Sector 26, Pune"
                    const parts = d.display_name.split(',').slice(0, 4);
                    return parts.join(',').trim();
                }
            } catch(e) {
                console.warn("Reverse geocode failed:", e);
            }
            return null;
        }

        function renderStudentAttendance(el, data) {

                            <div style="border-radius:12px;overflow:hidden;border:1px solid var(--bd2);background:var(--bg3);">

                        </div>
                        <button class="btnd" id="markAttBtn" onclick="markAttendance('${s.sessionToken}', ${s.requiresGPS}, ${s.teacherLat || 0}, ${s.teacherLng || 0}, ${s.radiusMeters || 25})" style="width:100%;padding:14px;border-radius:10px;font-size:14px;font-weight:700;background:linear-gradient(135deg,var(--gr),#00a87a);color:#fff;border:none;cursor:pointer">

                    // Initialize AWS Map (MapLibre) for student if GPS session
                    if (s.requiresGPS) {
                        setTimeout(() => {

                                const teacherPos = [s.teacherLng, s.teacherLat];

                                    container: 'studentLiveMap',

                                    map.addSource('radius-circle', {

                                    map.addLayer({
                                        id: 'radius-circle-fill',
                                        type: 'fill',
                                        source: 'radius-circle',
                                        paint: {
                                            'fill-color': '#00C896',
                                            'fill-opacity': 0.15
                                        }

                                    map.addLayer({

                            } else if (mapEl) {

                            }

                    }

                    // Add paste tracking
                    setTimeout(() => {
                        const iel = g('attStudentCode');

                            iel.dataset.pasted = 'false';
                            iel.addEventListener('paste', () => iel.dataset.pasted = 'true');

                    }, 50);

            } else {
                // No active session — show stats
                el.innerHTML = `
                <div style="padding:20px">
                    <div style="text-align:center;padding:30px 20px;margin-bottom:20px">
                        <i class="fas fa-calendar-check" style="font-size:36px;color:var(--mt);opacity:.4;margin-bottom:10px;display:block"></i>
                        <h4 style="font-size:15px;font-weight:700;color:var(--tx);margin-bottom:4px">No Active Session</h4>
                        <p style="font-size:13px;color:var(--mt)">Your instructor will start attendance when ready.</p>
                    </div>
                    <h4 style="font-size:14px;font-weight:700;margin-bottom:12px"><i class="fas fa-chart-bar" style="color:var(--ac);margin-right:6px"></i>My Attendance</h4>
                    <div id="attStats"><div style="text-align:center;color:var(--mt);padding:20px"><i class="fas fa-spinner fa-spin"></i></div></div>
                </div>`;
                loadMyAttendance();

        function startCountdown(expiresAt) {
            if (ATT_TIMER) clearInterval(ATT_TIMER);
            const timer = g('attTimer');
            if (!timer) return;

            ATT_TIMER = setInterval(() => {
                const now = Date.now();
                const end = new Date(expiresAt).getTime();
                const diff = Math.max(0, end - now);
                const mins = Math.floor(diff / 60000);
                const secs = Math.floor((diff % 60000) / 1000);
                timer.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

                if (diff <= 0) {
                    clearInterval(ATT_TIMER);
                    timer.textContent = 'Ended';
                    timer.style.color = 'var(--gr)';
                    timer.style.fontSize = '22px';
                    setTimeout(() => loadAttendanceTab(), 2000);
                } else if (diff < 30000) {
                    timer.style.color = 'var(--rd)';
                }
            }, 1000);
        }

        window.startAttendance = async function () {
            const code = (g('attCode')?.value || '').trim();
            const dur = g('attDuration')?.value || "240";
            const errEl = g('attError');
            if (!code || code.length < 3 || code.length > 30) {
                errEl.textContent = 'Code must be 3-30 characters';
                errEl.style.display = 'block';
                return;
            }

            const btn = g('startAttBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Getting GPS Location...';
            errEl.style.display = 'none';

            let teacherLat = null;
            let teacherLng = null;
            let gpsAccuracy = null;

            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 25000, maximumAge: 0, enableHighAccuracy: true });
                });
                teacherLat = pos.coords.latitude;
                teacherLng = pos.coords.longitude;
                gpsAccuracy = pos.coords.accuracy;
            } catch (e) {
                errEl.textContent = "GPS required for attendance verification. Please enable location services.";
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-play"></i> Start Attendance Session';
                return;
            }

            const exactLocationName = await getExactLocationName(teacherLat, teacherLng);

            btn.innerHTML = '<i class="fas fa-map-marked-alt"></i> Verify Location Below';
            const mapContainer = document.createElement('div');
            mapContainer.id = 'teacherMapVerify';
            mapContainer.innerHTML = `
                <div style="margin-top:16px;border-radius:12px;overflow:hidden;border:1px solid var(--bd2)">
                    <div style="background:var(--bg3);padding:10px 14px;font-size:12px;font-weight:700;color:var(--tx);border-bottom:1px solid var(--bd2);display:flex;justify-content:space-between;align-items:center">
                        <span><i class="fas fa-crosshairs" style="color:var(--ac);margin-right:6px"></i>Your Location</span>
                        <span style="font-size:10px;background:rgba(79,142,255,0.1);color:var(--ac);padding:2px 8px;border-radius:12px">±${Math.round(gpsAccuracy || 0)}m</span>
                    </div>
                    <div id="teacherVerifyMap" style="width:100%;height:220px;background:#1a1a2e"></div>
                    <div style="padding:12px 14px;background:var(--bg3);display:flex;gap:8px">
                        <button id="confirmLocBtn" class="btnd" style="flex:1;padding:12px;border-radius:10px;font-size:13px;font-weight:700;background:linear-gradient(135deg,var(--gr),#00a87a);color:#fff;border:none;cursor:pointer">
                            <i class="fas fa-check-circle"></i> Confirm & Start Session
                        </button>
                        <button id="retryLocBtn" class="btnd" style="padding:12px 16px;border-radius:10px;font-size:13px;font-weight:700;background:var(--bg2);color:var(--tx);border:1px solid var(--bd2);cursor:pointer" onclick="document.getElementById('teacherMapVerify').remove();g('startAttBtn').disabled=false;g('startAttBtn').innerHTML='<i class=\'fas fa-play\'></i> Start Attendance Session';">
                            <i class="fas fa-redo"></i>
                        </button>
                    </div>
                </div>`;
            btn.parentNode.insertBefore(mapContainer, errEl);

            setTimeout(() => {
                const mapEl = document.getElementById('teacherVerifyMap');
                if (mapEl && typeof maplibregl !== 'undefined') {
                    const pos = [teacherLng, teacherLat];
                    const map = new maplibregl.Map({
                        container: 'teacherVerifyMap',
                        style: AWS_MAP_STYLE_URL,
                        center: pos,
                        zoom: 17,
                        attributionControl: false
                    });
                    new maplibregl.Marker({ color: "#4F8EFF" }).setLngLat(pos).addTo(map);
                }
            }, 200);

            document.getElementById('confirmLocBtn').onclick = async () => {
                const cb = g('confirmLocBtn');
                cb.disabled = true;
                cb.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Starting...';
                
                try {
                    const payload = {
                        code, durationSeconds: parseInt(dur),
                        teacherLat, teacherLng,
                        locationName: exactLocationName
                    };
                    const r = await api(`/api/attendance/${CID}/start`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const d = await r.json();
                    if (!r.ok) throw new Error(d.message || 'Failed');
                    
                    toast('Attendance started successfully!', 'ok');
                    loadAttendanceTab();
                } catch (e) {
                    errEl.textContent = e.message;
                    errEl.style.display = 'block';
                    cb.disabled = false;
                    cb.innerHTML = '<i class="fas fa-check-circle"></i> Confirm & Start Session';
                }
            };
        };

        window.stopAttendance = async () => {
            if (!confirm("Are you sure you want to stop this attendance session immediately?")) return;
            const btn = g('stopAttBtn');
            const errEl = g('stopAttError');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Stopping...';
            }
            if (errEl) errEl.style.display = 'none';

            try {
                const r = await api(`/api/attendance/${CID}/stop`, { method: 'POST' });
                const d = await r.json();
                if (!r.ok) throw new Error(d.message || 'Failed to stop session');

                toast('Session stopped successfully.', 'info');
                loadAttendanceTab();
            } catch (e) {
                if (errEl) {
                    errEl.textContent = e.message;
                    errEl.style.display = 'block';
                } else {
                    toast(e.message, 'err');
                }
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-stop-circle"></i> Stop Session Now';
                }
            }
        };

        window.markAttendance = async function (sessionToken, requiresGPS, teacherLat, teacherLng, radiusMeters) {
            const codeEl = g('attStudentCode');
            const code = (codeEl?.value || '').trim();
            const errEl = g('attError');

            if (!code) {
                errEl.textContent = 'Please enter the attendance code';
                errEl.style.display = 'block';
                return;
            }

            if (!sessionToken) {
                errEl.textContent = 'Session token missing. Refresh page.';
                errEl.style.display = 'block';
                return;
            }

            const btn = g('markAttBtn');
            btn.disabled = true;

            // — Fraud Signals —
            const pasteDetected = codeEl.dataset.pasted === 'true';

            // — GPS (STRICT — no IP/network fallback!) —
            let studentLat = null;
            let studentLng = null;

            let studentExactLocationName = null;
            if (requiresGPS) {
                btn.innerHTML = '<i class="fas fa-satellite"></i> Getting Exact GPS...';
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 25000, maximumAge: 0, enableHighAccuracy: true });
                    });
                    studentLat = pos.coords.latitude;
                    studentLng = pos.coords.longitude;
                    const accuracy = pos.coords.accuracy;

                    // Fetch Exact Location Name for student
                    studentExactLocationName = await getExactLocationName(studentLat, studentLng);

                    // Show student on the AWS live map
                    if (window._attStudentMap && typeof maplibregl !== 'undefined') {
                        const studentPos = [studentLng, studentLat];
                        const tPos = window._attTeacherPos; // [lng, lat]
                        const map = window._attStudentMap;

                        // Student marker
                        new maplibregl.Marker({ color: "#4F8EFF" })
                            .setLngLat(studentPos)
                            .addTo(map);

                        // Line between teacher and student
                        map.addSource('route', {
                            'type': 'geojson',
                            'data': {
                                'type': 'Feature',
                                'properties': {},
                                'geometry': {
                                    'type': 'LineString',
                                    'coordinates': [tPos, studentPos]
                                }
                            }
                        });
                        map.addLayer({
                            'id': 'route',
                            'type': 'line',
                            'source': 'route',
                            'layout': {
                                'line-join': 'round',
                                'line-cap': 'round'
                            },
                            'paint': {
                                'line-color': '#FF6B6B',
                                'line-width': 2,
                                'line-dasharray': [2, 2]
                            }
                        });

                        // Fit both markers
                        const bounds = new maplibregl.LngLatBounds(tPos, tPos);
                        bounds.extend(studentPos);
                        map.fitBounds(bounds, { padding: 40 });

                        // Calculate distance using Haversine
                        const dist = haversineDist(tPos[1], tPos[0], studentLat, studentLng);

                        const sloc = g('studentLocDisplay');
                        if (sloc && dist !== null) {
                            const isInside = dist <= (radiusMeters || 25);
                            sloc.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
                                ${studentExactLocationName ? `<div style="font-size:12px;font-weight:700;color:var(--tx);margin-bottom:4px"><i class="fas fa-map-marker-alt" style="color:var(--ac)"></i> ${x(studentExactLocationName)}</div>` : ''}
                                <div style="display:inline-flex;align-items:center;gap:6px;background:${isInside ? 'rgba(0,200,150,0.1)' : 'rgba(255,71,87,0.1)'};color:${isInside ? 'var(--gr)' : 'var(--rd)'};padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;border:1px solid ${isInside ? 'rgba(0,200,150,0.3)' : 'rgba(255,71,87,0.3)'}">
                                    <i class="fas fa-${isInside ? 'check-circle' : 'exclamation-triangle'}"></i>
                                    ${Math.round(dist)}m away ${isInside ? '— Inside Zone ✓' : '— Outside Zone!'}
                                </div>
                                <div style="font-size:10px;color:var(--mt)">GPS accuracy: ±${Math.round(accuracy)}m</div>
                            </div>`;
                            sloc.style.display = 'flex';
                        }
                    } else {
                        const sloc = g('studentLocDisplay');
                        if (sloc) {
                            sloc.innerHTML = `<div style="display:inline-flex;align-items:center;gap:6px;background:rgba(0,200,150,0.1);color:var(--gr);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700"><i class="fas fa-user-circle"></i> Your Location: ${studentExactLocationName || (studentLat.toFixed(5)+', '+studentLng.toFixed(5))}</div>`;
                            sloc.style.display = 'flex';
                        }
                    }
                } catch (e) {
                    // STRICT: No fallback to low accuracy — that's what caused the Pinjam bug!
                    let errMsg = "❌ GPS is required to mark attendance.";
                    if (window.isSecureContext === false) {
                        errMsg = "❌ GPS needs HTTPS. Open v2.classgrid.in in your browser.";
                    } else if (e.code === 1) {
                        errMsg = "❌ GPS Permission Denied. Tap the lock icon in your browser → Allow Location.";
                    } else if (e.code === 2) {
                        errMsg = "❌ GPS Unavailable. Turn ON Location in your phone settings.";
                    } else if (e.code === 3) {
                        errMsg = "❌ GPS timed out. Move closer to a window or step outside briefly for GPS signal.";
                    }
                    errEl.textContent = errMsg;
                    errEl.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check"></i> Mark Attendance';
                    return;
                }
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Marking...';
            errEl.style.display = 'none';

            try {
                const payload = {
                    code,
                    sessionToken,
                    pasteDetected,
                    deviceFingerprint: await generateDeviceFingerprint()
                };
                if (studentLat) payload.studentLat = studentLat;
                if (studentLng) payload.studentLng = studentLng;
                if (studentExactLocationName) payload.locationName = studentExactLocationName;

                const r = await api(`/api/attendance/${CID}/mark`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const d = await r.json();
                if (!r.ok) throw new Error(d.message || 'Failed');

                toast(d.message || 'Attendance marked successfully!', 'ok');
                loadAttendanceTab();
            } catch (e) {
                errEl.textContent = e.message;
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Mark Attendance';
            }
        };

        async function loadPastSessions() {
            const el = g('attSessions');
            if (!el) return;
            try {
                const filterType = g('attFilterType')?.value || 'month';
                let qs = '';

                if (filterType === 'week') {
                    qs = '?filter=week';
                } else if (filterType === 'selectMonth') {
                    const mv = g('attFilterMonth')?.value || '';
                    if (mv) {
                        const [m, y] = mv.split('-');
                        qs = `?filter=month&month=${m}&year=${y}`;
                    } else {
                        qs = '?filter=month';
                    }
                } else if (filterType === 'semester') {
                    const sem = g('attFilterSem')?.value || '1';
                    qs = `?filter=semester&semester=${sem}`;
                } else {
                    // default: current month
                    qs = '?filter=month';
                }

                const r = await api(`/api/attendance/${CID}/sessions${qs}`);
                if (!r.ok) throw new Error('Failed');
                const { sessions } = await r.json();
                if (!sessions || sessions.length === 0) {
                    el.innerHTML = '<div style="text-align:center;color:var(--mt);padding:20px;font-size:13px">No sessions found for this period.</div>';
                    return;
                }
                el.innerHTML = sessions.map(s => {
                    const d = new Date(s.createdAt || s.startsAt);
                    const dateStr = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
                    const timeStr = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
                    return `<div onclick="window.location.href='/view-classroom-attendance-data.html?sessionId=${s._id}&classroomId=${CID}'" style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:10px;background:var(--bg3);border:1px solid var(--bd);margin-bottom:6px;cursor:pointer;transition:all .15s" onmouseenter="this.style.borderColor='var(--ac)'" onmouseleave="this.style.borderColor='var(--bd)'">
                        <div><div style="font-size:13px;font-weight:700">${dateStr}, ${timeStr}</div><div style="font-size:11px;color:var(--mt);margin-top:2px">${s.status} &bull; Click to view details</div></div>
                        <div style="display:flex;align-items:center;gap:10px">
                            <div style="font-size:14px;font-weight:700;color:var(--gr)">${s.presentCount || 0} <span style="font-size:11px;color:var(--mt);font-weight:500">present</span></div>
                            <i class="fas fa-chevron-right" style="color:var(--dm);font-size:11px"></i>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) {
                el.innerHTML = '<div style="text-align:center;color:var(--rd);padding:20px;font-size:13px">Failed to load sessions.</div>';
            }
        }

        function populateMonthDropdown() {
            const sel = g('attFilterMonth');
            if (!sel) return;
            const now = new Date();
            sel.innerHTML = '';
            for (let i = 0; i < 12; i++) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const m = d.getMonth() + 1;
                const y = d.getFullYear();
                const label = d.toLocaleDateString('en-IN', { month: 'short', year: 'numeric' });
                sel.innerHTML += `<option value="${m}-${y}"${i === 0 ? ' selected' : ''}>${label}</option>`;
            }
        }

        window.onAttFilterChange = function () {
            const ft = g('attFilterType')?.value;
            const monthSel = g('attFilterMonth');
            const semSel = g('attFilterSem');
            if (monthSel) monthSel.style.display = ft === 'selectMonth' ? '' : 'none';
            if (semSel) semSel.style.display = ft === 'semester' ? '' : 'none';
            loadPastSessions();
        };

        async function loadMyAttendance() {
            const el = g('attStats');
            if (!el) return;
            try {
                // Load detailed per-session data
                const r = await api(`/api/attendance/my-detailed?classroom=${CID}`);
                if (!r.ok) throw new Error('Failed');
                const d = await r.json();
                const classrooms = d.classrooms || [];
                const cr = classrooms[0]; // Only one classroom since we filtered

                if (!cr || !cr.sessions.length) {
                    el.innerHTML = '<div style="text-align:center;color:var(--mt);padding:20px;font-size:13px">No attendance data yet.</div>';
                    return;
                }

                const pct = cr.total > 0 ? Math.round((cr.present / cr.total) * 100) : 0;
                const pctColor = pct >= 75 ? 'var(--gr)' : 'var(--rd)';
                const statusText = pct < 75 ? '⚠️ Below 75% — defaulter' : '✅ Good standing';

                el.innerHTML = `
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">
                    <div style="background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:14px;text-align:center">
                        <div style="font-size:24px;font-weight:800;color:var(--ac)">${cr.total}</div>
                        <div style="font-size:11px;color:var(--mt);font-weight:600">Total</div>
                    </div>
                    <div style="background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:14px;text-align:center">
                        <div style="font-size:24px;font-weight:800;color:var(--gr)">${cr.present}</div>
                        <div style="font-size:11px;color:var(--mt);font-weight:600">Present</div>
                    </div>
                    <div style="background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:14px;text-align:center">
                        <div style="font-size:24px;font-weight:800;color:var(--rd)">${cr.absent}</div>
                        <div style="font-size:11px;color:var(--mt);font-weight:600">Absent</div>
                    </div>
                </div>
                <div style="margin-bottom:16px;background:var(--bg3);border:1px solid var(--bd);border-radius:12px;padding:18px;text-align:center">
                    <div style="font-size:38px;font-weight:900;color:${pctColor}">${pct}%</div>
                    <div style="font-size:12px;color:var(--mt);font-weight:600">${statusText}</div>
                </div>
                <h4 style="font-size:13px;font-weight:700;margin-bottom:10px"><i class="fas fa-list" style="color:var(--ac);margin-right:5px"></i>Session History</h4>
                <div style="display:flex;flex-direction:column;gap:4px">${cr.sessions.map(s => {
                    const sd = new Date(s.date);
                    const dl = sd.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
                    const tl = sd.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
                    const icon = s.status === 'present'
                        ? '<i class="fas fa-check-circle" style="color:var(--gr)"></i>'
                        : '<i class="fas fa-times-circle" style="color:var(--rd)"></i>';
                    const label = s.status === 'present' ? 'Present' : 'Absent';
                    const labelColor = s.status === 'present' ? 'var(--gr)' : 'var(--rd)';
                    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;background:var(--bg3);border:1px solid var(--bd)">
                        <div style="font-size:12.5px;font-weight:600">${dl}, ${tl}</div>
                        <div style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:${labelColor}">${icon} ${label}</div>
                    </div>`;
                }).join('')}</div>`;
            } catch (e) {
                el.innerHTML = '<div style="text-align:center;color:var(--mt);padding:20px;font-size:13px">No attendance data yet.</div>';
            }
        }




        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>

    <!-- SPA Router: instant navigation between classroom/view-classroom/settings -->
    <script src="/js/spa-router.js"></script>
